# The peter rigs for scripts/pipeline.py --dataset campus_board | climb_wall_2 | climb_wall_3
# (datasets/peter/README.md), and the gt_contact variant. Paths are relative to the data root
# (bvr/paths.py: ../data, or $BVR_DATA_ROOT); configs are paths relative to the repo root. A rig
# has several synchronized static cameras (`views`: <root>/<clip>/<view>.mp4) and force boards. The
# first view is the one the single-view tree `out` was built from; any other `--views` selection
# goes to `out_multi`, where only `multi_steps` run (every later stage assumes one view). `steps`
# is the chain, in order: the first five are manifest sweeps (the model loads once and sweeps every
# clip), the rest run per clip. No gravity step (the rig runs never used GeoCalib).

[datasets.campus_board]
root = "peter/campus_board"
views = ["cam_left", "cam_right"]
out = "peter/out_campus_board_single"
out_multi = "peter/out_campus_board_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "datasets/peter/configs/pipeline_peter.toml"
human_config = "datasets/peter/configs/human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

[datasets.climb_wall_2]
root = "peter/climb_wall_2"
views = ["cam_left", "cam_right", "cam_3"]
out = "peter/out_climb_wall_2_single"
out_multi = "peter/out_climb_wall_2_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "datasets/peter/configs/pipeline_peter.toml"
human_config = "datasets/peter/configs/human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

[datasets.climb_wall_3]
root = "peter/climb_wall_3"
views = ["cam_left", "cam_right", "cam_3"]
out = "peter/out_climb_wall_3_single"
out_multi = "peter/out_climb_wall_3_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "datasets/peter/configs/pipeline_peter.toml"
human_config = "datasets/peter/configs/human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

# The contact-consuming chain on MEASURED board contacts (datasets/peter/board_contacts.md); the
# variant keys are documented in datasets/opencap/configs/dataset.toml.
[variants.gt_contact]
steps = ["contacts_1", "kinematics_2", "contacts_2", "kindyn_1", "overlay"]
config = "datasets/peter/configs/human_optimization_peter.toml"
inherit = ["kinematic_1.npz", "sensor_forces.npz"]
contacts = "boards"
overlay = "datasets.peter.render_kindyn_overlays"
requires = "human_optim/sensor_forces.npz"
