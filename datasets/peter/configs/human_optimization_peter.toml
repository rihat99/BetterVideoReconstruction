# PETER VARIANT of configs/human_optimization.toml — the knobs below are laid over it
# (bvr.config.load_config). [contacts].frames restricts the contact frames to the hands and feet:
# the peter demonstrator rigs only instrument a board/plate under each limb, so contact detected on
# knees / elbows / torso would route force where nothing measures it. The kinematic chamfer is OFF
# as well (see its line), and [measured_contacts] holds the thresholds measure_contacts reads. Also used
# for the LAAS Parkour clips (one static camera, plates + bar).
base = "configs/human_optimization.toml"

[loss_weights.kinematic]
chamfer             = [0, 0, 0, 0]     # PETER: OFF everywhere (user, 2026-07-26; lost in 860cbd3, restored 2026-09-17) — ONE static camera gives VGGT no parallax, and the human depth sits the limbs at the wrong depth (Parkour: ankle/wrist error +20 mm vs the init).

[contacts]
frames = [
    "palm_left", "palm_right", "palm_distal_left", "palm_distal_right",
    "finger_left", "finger_right", "thumb_left", "thumb_right",
    "heel_left", "heel_right", "ball_inner_left", "ball_outer_left",
    "ball_inner_right", "ball_outer_right", "big_toe_left", "big_toe_right",
    "toe_above_left", "toe_above_right",
]                      # PETER: hands + feet only — the rigs instrument one board per limb.
                       # Read wherever the chain builds the body (kin1 / kin2 / kindyn + the readout
                       # stage), so the restriction hits detection, labels and forces in one move.

# Contact labels MEASURED by the force boards, for the instrumented rigs
# (bvr/stages/measure_contacts.py — the drop-in replacement for the estimated contacts).
# One three-axis board per limb says which limb is loaded and when; near_scene_m decides which of
# that limb's contact frames carries the label. Same numbers as the three-camera ground-truth
# chain, so the two trees are comparable.
[measured_contacts]
force_enter_n = 50       # a limb is in contact from this measured |F| ...
force_exit_n = 30        # ... until it drops below this (hysteresis)
near_scene_m = 0.05      # its contact frames within this of the wall get the label; none -> its nearest
