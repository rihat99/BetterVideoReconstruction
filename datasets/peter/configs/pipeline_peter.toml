# Stage knobs for the peter rigs and Parkour (scripts/pipeline.py --dataset campus_board |
# climb_wall_2 | climb_wall_3 | parkour): configs/pipeline.toml with every model-stage overlay OFF
# (the peter batch is 24+ clips and the mesh renders cost more than the fits do), finished items
# skipped, chunked VGGT, and the static-camera human depth kept out of the scale (no pre-fit, no
# confidence cut). Only the knobs below differ from the base (bvr.config.load_config merges them).
base = "configs/pipeline.toml"

[sam3]
top_k = 1                  # keep ONLY the largest frame-0 person mask — climb_wall_2's cam_left
                           # sees a second person in the background; the climber is the big mask
overlay = false
skip_existing = true

[vggt]
frame_chunk = 128           # PETER 2026-09-08: chunked — the whole-clip forward needs ~43 GB at 500 frames, which does not fit next to a labmate's job; chunking matches to bf16 rounding (~3e-4)
token_chunk = 65536         # query tokens per chunk of the cross-frame attention (see frame_chunk)
skip_existing = true

[sapiens]
overlay = false
skip_existing = true

[scale]
conf_drop_q = 0.0           # PETER: static-camera VGGT confidence is uniformly low at the limbs — the 0.3 cut would hide the hands/arms from the ruler median; un-gated keeps every body pixel voting
prefit = false              # PETER: OFF (user, 2026-07-26 — do not rely on the static-camera human depth at
                            # all). The pre-fit is a chamfer fit against the human cloud, so it drags the
                            # body/init to the same wrong depth the kinematic chamfer was banned for. Ruler-only
                            # scale keeps depth's influence to one robust median scalar (the body is the only
                            # metric anchor there is); the kinematics then init from the converter bodies.
                            # NOTE: delete any stale geometry/prefit.npz — kinematics inits from it when present.

[fuse]
conf_drop_q = 0.0           # PETER: the 0.3 cut deleted the campus board outright (VGGT rebuilds it at the right depth, 5.8 m vs wall 6.4 m, but low-confidence — static camera); un-gated the board survives
human_dilate = 2            # PETER: 8 px erased the gripped-rung band around the hands; 2 keeps it while still cutting the person

[sam3d]
overlay = false
skip_existing = true

[smplx]
overlay = false
skip_existing = true
