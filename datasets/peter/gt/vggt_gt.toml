# VGGT-Omega knobs for the climb_wall_3 ground-truth sets (datasets/peter/gt/reconstruct_vggt.py).
# A copy of [vggt] from datasets/peter/configs/pipeline_peter.toml: three still images per set, so the
# whole forward fits at once and the chunking of the video runs is not needed.

[runtime]
device = "cuda"

[vggt]
max_frames = 500            # cap per view; a set has one frame per view anyway
frame_chunk = 0             # 0 = whole sequence in one go (3 images)
token_chunk = 0             # 0 = no cross-frame attention chunking
image_resolution = 512      # VGGT input resolution
mode = "balanced"           # load_and_preprocess_images sizing
save_depth = true           # per-view depth + confidence; the cloud needs it
checkpoint = "facebook/VGGT-Omega"
subdir = "vggt"
skip_existing = false       # ALWAYS re-run: the upright and raw cam_3 variants write the
                            # same camera.npz path shape, and reusing the other variant's
                            # solve is silently wrong (cam_3 comes out 90 deg off)
dtype = "fp16"
