# ClimbingVideos corpus orchestration and corpus-tool configuration.
# Relative paths are resolved from the repository root.

[corpus]
data_root = "../data/ClimbingVideos" # Scene DB + read-mostly feature tree (old default).
categories = [1, 2]                  # Curated VLM categories: indoor boulder + indoor rope.
rope_supported = 0                  # Require no rope support; -1 removes this filter.
seed = 0                            # Deterministic RNG seed used by --sample.
devices = [0, 0, 1, 1, 5]           # CUDA device ids; one stride-sharded worker per entry (GPU 5: single shard — it has a ~6 GiB neighbour).
skip_existing = false               # Full-chain refresh 2026-08-26: overwrite old results so every scene gets one consistent chain.
out_root = ""                       # Contacts-only output-tree redirect; empty writes beside inputs.
debug_overlay_dir = ""              # Gather overlays here; empty uses features/<stage>/_debug_overlays.
pipeline_config = "configs/pipeline.toml" # Model-stage algorithm knobs (read, never modified).
human_optim_config = "configs/human_optimization.toml" # Human/contact algorithm knobs.

[overlay]
# Old per-driver defaults. Stages without a key do not produce/gather an overlay.
sam3 = true
sapiens = false
sam3d = false
smplx = false
human_optim = false
contacts = false

[track_sam3]
min_presence = 0.9          # Minimum primary-mask frame fraction when discarding failures.
discard_failed = false      # Write failed SAM3 QA back to scenes.db only after clean workers.
text = "person"             # First-frame SAM3 grounding phrase.
iou_thresh = 0.2            # Minimum grounded-mask/YOLO-box IoU for prompt selection.
ground_min_area_frac = 0.002 # Reject smaller grounded masks before IoU matching.
confidence = 0.5            # SAM3 text-grounding confidence.
part_length = 200           # Frames per SAM3 propagation part.

[split]
test_frames_frac = 0.10       # Target fraction of curated-corpus FRAMES in test.
max_test_video_scenes = 4     # Only videos this small can be drawn into test (big videos are too self-similar).
seed = 0                      # Deterministic draw among the small new videos.

[contacts_run]
bodies = "kinematic_1"      # Body artifact to score; produces contacts_1.npz (or use kinematic_2).
