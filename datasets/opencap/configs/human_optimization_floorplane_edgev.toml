# EXPERIMENT VARIANT of human_optimization_floorplane.toml (scripts/pipeline.py --dataset opencap
# --variant floorplane_edgev): the kindyn_1 edge knobs on — force_edge = 3000, edge_speed_m_s = 0.8
# (shape mass; the massedgev twin, retired 2026-10-08, used the measured mass). Laid over the
# floorplane config.
base = "datasets/opencap/configs/human_optimization_floorplane.toml"

[stages.kindyn_1]
edge_speed_m_s = 0.8     # force_edge weight × 1/(1+(v/0.8)²), v = the body's (root joint) downward speed at an onset / upward at a release, frozen pose: a drop-jump landing (~2.5 m/s) may step, a walking heel strike (<0.4 m/s) may not
mass_kg = 0              # the subject's measured mass in kg; 0 = the shape-baked mass (the pipeline as it runs without it)

[loss_weights.dynamics]
force_edge          = [0, 0, 0, 3000]   # penalise the force on the first/last frame of every contact interval (ramp in/out, no step at a contact switch)
