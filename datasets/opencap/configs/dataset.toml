# OpenCap LabValidation for scripts/pipeline.py --dataset opencap (datasets/opencap/README.md), and
# its variant chains. Paths are relative to the data root (bvr/paths.py: ../data, or $BVR_DATA_ROOT);
# configs are paths relative to the repo root. One video per clip (`clips`: the glob that finds them,
# <root>/<clip>/video.mp4); `steps` is the chain, in order: the first five are manifest sweeps (the
# model loads once and sweeps every clip), the rest run per clip.

[datasets.opencap]            # datasets/opencap/import_opencap.py writes processed/<clip>/; one static iPhone
root = "LabValidation_withVideos/processed"
clips = "*/video.mp4"
out = "LabValidation_withVideos/processed/out"
pipeline_config = "datasets/opencap/configs/pipeline_opencap.toml"
human_config = "datasets/peter/configs/human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale", "gravity",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

# `--variant <name>` re-runs the human chain into <clip>/human_optim_<name>/ through a
# symlink farm <clip>/_<name>/ (inputs link to the real tree, human_optim IS the variant
# directory), leaving human_optim/ intact. A name without a table runs the plain chain
# (kinematics_1 .. kindyn_1) with configs/human_optimization_<name>.toml. Variant names are
# global: any dataset may run any variant.
#   steps     its own chain (default: the plain chain); a support_scene_* step makes the
#             farm own geometry/, with the variant's synthetic scene.npz in it
#   config    human TOML (default: human_optimization_<name>.toml)
#   inherit   files of the normal run's human_optim/ linked in instead of recomputed
#   contacts  "boards": measured board contacts (measure_contacts_boards.py), not estimated
#   overlay   `python -m` module run on the finished run directory by the overlay step
#   requires  a file under <out>/<clip>/ a clip must have to be run at all

[variants.floorplane]         # a synthetic support scene replaces the fused cloud
steps = ["support_scene_floor", "kinematics_1", "support_scene_plateaus",
         "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]
config = "datasets/opencap/configs/human_optimization_floorplane.toml"

# The plain chain with the edgev kindyn knobs on the clip's REAL fused cloud. The edgev
# runs on disk were kindyn-only reruns inside the floorplane farm (geometry and the
# kinematics/contacts linked from human_optim_floorplane); no committed code builds that
# layout, so this variant does not reproduce them.
[variants.floorplane_edgev]
config = "datasets/opencap/configs/human_optimization_floorplane_edgev.toml"
