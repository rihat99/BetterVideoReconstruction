# FLOORPLANE VARIANT of configs/human_optimization.toml for the OpenCap LabValidation trials
# (scripts/pipeline.py --dataset opencap --variant floorplane) — the knobs below are laid over it.
#
# The variant feeds the chain a SYNTHETIC scene cloud instead of the fused VGGT one
# (bvr/stages/build_support_scene.py): the accepted ground plane as a lattice, plus one horizontal
# patch per surface the body was found resting on above it (the drop-jump box, the sit-to-stand
# chair). Contact therefore comes from distance to that floor plus stillness. Three choices, all in
# [contacts]:
#
# 1. frames — the FEET (heel, ball_inner, ball_outer, big_toe, toe_above on both sides) plus
#    sit_left / sit_right, the sit bones. The trials are walking, squats, sit-to-stand and drop
#    jumps: the only things the subject touches are the floor and, in the sit-to-stand trials, the
#    chair. The chair is NOT measured by the force plates, so with no seat frame the chair's load
#    was routed to the feet instead (~150 N per foot while seated, against plates reading ~1 N).
#    NO HAND FRAMES: nobody touches anything with the hands in any of these trials, so the plate
#    ground truth for both hands is a measured zero — and a hands+feet run labelled the hands in
#    contact on 30-80 % of frames, all of it false, carrying up to 556 N of invented support.
# 2. floor_gate_m — OFF. A foot frame can only be near the synthetic scene where that scene has a
#    surface, which is what the gate (0.17 m, the p95 foot-frame height on plate-loaded walking
#    frames — see git history for the measurement) was a stand-in for; keeping it would delete the
#    box and chair patches this variant exists to model.
# 3. sole_offset_m — shod feet. The plates measure people in running shoes, whose heel stack is
#    thicker than the forefoot, and the fitted heel frame rides 6-11 cm above the floor plane while
#    the plate is loaded (toes: 2-5 cm), so the geometric arm (close < 8 cm) drops the heel on
#    40-60 % of loaded walking frames. Each listed frame stem is pushed out along its outward normal
#    by this many metres in the body itself (bvr.body.Body), so detection, penetration, attraction
#    and the force lever arms all see the sole. heel = the loaded heel-minus-toe median gap on the
#    12 comparison clips.
base = "configs/human_optimization.toml"

[contacts]
frames = [
    "heel_left", "heel_right", "ball_inner_left", "ball_outer_left",
    "ball_inner_right", "ball_outer_right", "big_toe_left", "big_toe_right",
    "toe_above_left", "toe_above_right",
    "sit_left", "sit_right",
]                      # the two feet + the sit bones, no hands — see the header. Read wherever the
                       # chain builds the body (kin1 / kin2 / kindyn + the readout stage), so the
                       # restriction hits detection, labels and forces in one move.
floor_gate_m = 0       # off: the synthetic scene is the floor plane plus the patches the body rests
                       # on, so "near the scene" already means "on a surface" (see the header)
sole_offset_m = { heel = 0.03 }
