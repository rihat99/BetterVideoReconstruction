[project]
name = "better-video-reconstruction"
version = "0.1.0"
description = "Monocular-video human reconstruction (SAM3 track → VGGT camera → SAM-3D-Body → MHR→SMPL-X → visually-guided kinematic refinement)"
requires-python = ">=3.12"
dependencies = [
    # The sibling libraries, fetched from GitHub (uv.sources); see INSTALL.md for the local override.
    "better-robot",
    "better-human",
    # the viewer's UI library (bvr/viewer runs on better-robot's viser-based viewer)
    "viser>=1.0",
    # MHR (Momentum Human Rig) — submodule
    "mhr",
    "pymomentum-gpu",
    # pypose: SE3/SO3 tangent ops (Lie-group manifold math).
    "pypose",
    # Force torch/torchvision to match pymomentum-gpu's cu129 ABI (see uv.sources below).
    "torch>=2.8,<2.9",
    "torchvision",
    # sam3 (video human tracker)
    "sam3",
    "decord",
    "psutil",
    # Sapiens2 (Meta) — pose / pointmap / normal heads. Distribution name is ``sapiens``;
    # the path source below points at the submodule.
    "sapiens",
    # sam-3d-body deps (no pyproject.toml in repo)
    "pytorch-lightning",
    "pyrender",
    "opencv-python",
    "yacs",
    "scikit-image",
    "einops",
    "timm",
    "dill",
    "pandas",
    "rich",
    "hydra-core",
    "hydra-submitit-launcher",
    "hydra-colorlog",
    "pyrootutils",
    "webdataset",
    "networkx==3.2.1",
    "roma",
    "joblib",
    "seaborn",
    "wandb",
    "appdirs",
    "cython",
    "jsonlines",
    "xtcocotools",
    "loguru",
    "optree",
    "fvcore",
    "pycocotools",
    "tensorboard",
    "huggingface_hub",
    # VGGT-Omega (multi-view camera + geometry) — vendored, backs estimate_camera_vggt.
    "vggt-omega",
    # utils3d — depth-map edge filter used by bvr/geometry/clean.py (previously
    # pulled transitively via MoGe; pinned directly now that MoGe is gone).
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
    # GeoCalib (cvg, ECCV'24) — single-image camera + gravity calibration, submodule.
    # Backs estimate_gravity_geocalib.py: the camera moves/tilts so gravity can't come
    # from it; GeoCalib recovers it per frame. Inference-only deps (adds kornia).
    "geocalib",
    "scikit-learn>=1.4",
    # Gemma 4 VLM (legacy/ triage stage): transformers + accelerate (device_map="auto")
    # + bitsandbytes (4/8-bit quantization). Kept installed pending that stage's revival.
    "transformers>=4.50",
    "accelerate>=0.30",
    "bitsandbytes>=0.46",
    "trimesh>=4.0",
    # SMPL-X body model (pip package) — backs convert_mhr_to_smplx.py. BetterHuman's
    # native SMPLX has no jaw/eye/face deformation yet, so the MHR→SMPL-X fitter uses
    # the standard smplx package (loads ../BetterHuman/models/smplx/SMPLX_*.npz).
    "smplx>=0.1.28",
    # sam3 still uses pkg_resources, which setuptools 80+ no longer ships by
    # default; pin below that cutoff so ``import pkg_resources`` keeps working.
    "setuptools<80",
    "open3d>=0.19.0",
    # datasets/opencap/import_opencap.py reads the OpenCap trial videos (get_ffmpeg_exe,
    # read_frames); covered by tests/test_opencap_forces.py.
    "imageio-ffmpeg>=0.6.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bvr*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests", "datasets"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
better-robot = { git = "https://github.com/rihat99/BetterRobot", branch = "main" }
better-human = { git = "https://github.com/rihat99/better_human", branch = "main" }
mhr = { path = "third_party/MHR", editable = true }
sam3 = { path = "third_party/sam3", editable = true }
sapiens = { path = "third_party/sapiens2", editable = true }
# VGGT-Omega is not on PyPI — install editable from the vendored copy (we patch it
# for chunked low-memory inference, so it is no longer a submodule).
vggt-omega = { path = "third_party/vggt-omega", editable = true }
geocalib = { path = "third_party/geocalib", editable = true }
# pymomentum-gpu wheels are built against PyTorch cu129 — force torch/torchvision
# to the matching CUDA 12.9 build to avoid ABI segfaults (momentum issue #939).
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.uv]
override-dependencies = [
    # sam3 and vggt-omega pin numpy<2 but work fine with numpy 2.x; better-robot requires >=2.0
    "numpy>=2.0",
]

[tool.uv.extra-build-dependencies]
xtcocotools = ["numpy", "cython"]
