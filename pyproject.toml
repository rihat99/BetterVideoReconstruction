[project]
name = "better-video-reconstruction"
version = "0.1.0"
description = "Monocular-video human reconstruction (SAM3 track → VGGT camera → SAM-3D-Body → MHR→SMPL-X → visually-guided kinematic refinement)"
requires-python = ">=3.12"
dependencies = [
    # The sibling libraries (uv.sources). The viewer extra brings viser: bvr/viewer runs on
    # better-robot's viewer.
    "better-robot[viewer]",
    "better-human",
    # The torch better-robot's compiled path is gated on.
    "torch>=2.13,<2.14",
    "torchvision",
    # sam3 (video human tracker)
    "sam3",
    "psutil",
    # Sapiens2 (Meta) pose. Distribution name is ``sapiens``;
    # the path source below points at the submodule.
    "sapiens",
    # sam-3d-body deps (no pyproject.toml in repo)
    "pytorch-lightning",
    "pyrender",
    "opencv-python",
    "yacs",
    "scikit-image",
    "einops",
    "timm",
    "dill",
    "pandas",
    "rich",
    "hydra-core",
    "hydra-submitit-launcher",
    "hydra-colorlog",
    "pyrootutils",
    "webdataset",
    "networkx==3.2.1",
    "roma",
    "joblib",
    "seaborn",
    "wandb",
    "appdirs",
    "cython",
    "jsonlines",
    "xtcocotools",
    "loguru",
    "optree",
    "fvcore",
    "pycocotools",
    "tensorboard",
    "huggingface_hub",
    # VGGT-Omega (multi-view camera + geometry), submodule, backs estimate_camera_vggt.
    "vggt-omega",
    # utils3d — depth-map edge filter used by bvr/geometry/clean.py (previously
    # pulled transitively via MoGe; pinned directly now that MoGe is gone).
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
    # GeoCalib (cvg, ECCV'24) — single-image camera + gravity calibration, submodule.
    # Backs estimate_gravity.py: the camera moves/tilts so gravity can't come
    # from it; GeoCalib recovers it per frame. Inference-only deps (adds kornia).
    "geocalib",
    "scikit-learn>=1.4",
    "trimesh>=4.0",
    # sam3 still uses pkg_resources, which setuptools 80+ no longer ships by
    # default; pin below that cutoff so ``import pkg_resources`` keeps working.
    "setuptools<80",
    # bvr_datasets/opencap/import_opencap.py reads the OpenCap trial videos (get_ffmpeg_exe,
    # read_frames).
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bvr*", "bvr_datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
better-robot = { git = "https://github.com/rihat99/BetterRobot", rev = "b4f60d8f6c960f933ad422117c323b03ca5e488b" }
better-human = { git = "https://github.com/rihat99/BetterHuman", rev = "323f6f1ea72acfde60cc5be1685b586916aa3d70" }
sam3 = { path = "third_party/sam3", editable = true }
sapiens = { path = "third_party/sapiens2", editable = true }
# VGGT-Omega is not on PyPI: installed editable from its submodule.
vggt-omega = { path = "third_party/vggt-omega", editable = true }
geocalib = { path = "third_party/geocalib", editable = true }
# The CUDA 12.9 build, the one better-robot and better-human lock.
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[tool.uv]
override-dependencies = [
    # sam3 and vggt-omega pin numpy<2 but work fine with numpy 2.x; better-robot requires >=2.0
    "numpy>=2.0",
]

[tool.uv.extra-build-dependencies]
xtcocotools = ["numpy", "cython"]
