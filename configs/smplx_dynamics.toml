# SMPL-X dynamics (force-only RNEA) — scripts/stages/optimize_dynamics_smplx.py
#
# With the kinematics_2 trajectory frozen, solve per-contact-joint world-frame
# linear forces so the RNEA base wrench (the un-actuatable free-flyer root) goes
# to zero; the joint torques are whatever RNEA returns. This is the first SMPL-X
# dynamics pass — forces only.

[weights]
# Drive the residual base wrench tau[:6] → 0 (the physical force/torque balance).
base_wrench = 1.0
# Minimum-norm regulariser: picks the unique smallest-force solution when the
# contact set is redundant. Small so it barely perturbs the balance.
force_magnitude = 0.01
# Temporal smoothness — the per-frame force solve is otherwise independent, so the
# forces (and the torques they induce) flicker frame-to-frame. These penalise the
# frame-to-frame change of the contact force (only within a sustained grip — both
# frames in contact) and of the joint torques. Raise for smoother, lower for a
# stricter per-frame balance.
force_smooth = 0.02
torque_smooth = 0.02

[contact]
# Force-bearing joint groups (resolved in _contact_catalog). A group is active on
# a frame when ANY sub-joint it covers is in contact (cnt_kin_2). Hands apply the
# resultant at the wrist, feet at the toe. Add "left_knee"/"right_hip"/… to opt in
# to more contact points (catalog also defines knees/hips/elbows).
groups = ["left_hand", "right_hand", "left_foot", "right_foot"]

[inertia]
# The SMPL-X-mid body has no shipped part segmentation, so per-body inertia comes
# from LBS-segmented convex hulls renormalised to this total mass (kg). The body's
# global scale is folded in separately (mass ∝ scale³).
total_mass_kg = 70.0
density = 1000.0   # working density; cancels under the total-mass renormalisation

[optimizer]
# L-BFGS (strong-Wolfe). The per-frame force solve is a small linear least-squares;
# it converges in a handful of iterations.
max_iter = 200
history_size = 20
lr = 1.0
tolerance_grad = 1e-9
tolerance_change = 1e-12

[runtime]
device = "cpu"   # RNEA over 52 joints × ~450 frames is light; avoids GPU contention
