# human_optimization — one config, four stages.
# Loss-weight rows are per-stage arrays, columns = [root, kinematics_1, kinematics_2, kindyn_1].
# Scene/annotation terms apply from a stage's refine phase (the body seats first) — except
# kinematics_2, which runs them from its root phase so the contact-patch repair (ann_acquisition
# + ann_seating) acts from the start and the rigid root phase pushes the body toward the wall.
# kindyn_1 = joint kinematics + dynamics: its kinematic columns copy kinematics_2, and it
# turns on the dynamics terms too. kindyn_1 weights are LINEAR (0.5·Σresidual² times the
# weight, like every engine term).

[stages]
run = ["root", "kinematics_1"]   # default chain; kinematics_2 / kindyn_1 (full-auto since 2026-08) are opt-in

[stages.root]
iters = { root = 150 }

[stages.kinematics_1]
# kin1 auto-contacts: labels detected ONCE at the refine phase (readout at the [auto_contact] point),
# frozen, then drive the attraction (ann_attraction). ann_attraction[kin1]=0 gives a pure visual fit.
iters = { full = 300, refine = 200, lbfgs = 30 }
overlay = false          # reprojected-keypoint debug overlay → human_optim/kinematic_1_overlay.mp4
labels = "auto"          # the only supported source: the geometric contact-frame detector above.
freeze_fingers = true    # pin the 30 finger quaternions at their converter values — the finger
                         # joints carry the two fingertip contact frames but are not fitted.
                         # Set false to FIT the hand pose; only meaningful together with
                         # [keypoints].include_hands = true, which gives the fingertips a 2D witness.
finger_smooth_s = 0.2    # Gaussian sigma (SECONDS) for smoothing that frozen finger trajectory over
                         # time. The converter estimates the hand per frame, so it jitters (measured
                         # 1.5-3.7 deg/frame), and freezing keeps the jitter. 0.2 s removes ~90% of it
                         # and leaves the body fit and the fingertip 2D residual unchanged. 0 = off.

[stages.kinematics_2]
# Contact-patch repair. In "auto" mode the repair instances ARE the 12 contact frames: each
# labelled frame is pulled toward the patch of wall it appears on — one point per label, the
# same points contact is detected on and forces are solved at. Both knobs matter: the
# acquisition WEIGHT sets the pull's force balance against reproj/priors (its far gradient is
# weight·delta_m), while ITERS set how far the body can travel per phase (Adam step budget).
# So root ↑ (rigid push toward the wall) then full ↑ before the refine polish. L-BFGS OFF
# (0 iters, phase dropped) — the per-phase contact patches make an active set that churns and
# invalidates strong-Wolfe curvature.
iters = { root = 100, full = 200, refine = 250, lbfgs = 0 }
overlay = false          # debug overlay → human_optim/kinematic_2_overlay.mp4
labels = "auto"          # contact labels: "auto" (contacts_1's 12 contact frames — the pipeline default) | "manual" (data/<stem>.npz per-joint annotations; metrics only)

[stages.kindyn_1]
# Joint kinematics + dynamics. Starts from a converged body + its contact labels and optimizes
# pose AND the per-CONTACT-FRAME forces together, so the RNEA base wrench can reshape the motion
# instead of only being absorbed by forces. A frame's force enters RNEA as a wrench on its parent
# joint (the force plus the moment of its lever arm), so the two toes of a foot stay distinct.
# Forces are warm-started (a frozen-q solve, [dynamics_optimizer] knobs), then ONE joint L-BFGS
# phase fine-tunes pose + forces together — Adam was tried and is destructive here (it cannot
# co-adapt N-scale forces to a moving pose; the wrench spikes and the motion wrecks).
iters = { lbfgs = 150 }  # one joint L-BFGS polish (pose + forces); Adam can't co-adapt N-scale forces
bodies = "kinematic_2"   # which refined body to start from (kinematic_2 | kinematic_1 — for chains that skip kinematics_2); picks the matching contacts_<n> too
labels = "auto"          # contact labels: "auto" (the contacts_<n> of `bodies` — the pipeline default) | "manual" (data/<stem>.npz, spread onto the frames each joint covers; metrics only)
cones = true             # confine every contact force to a friction pyramid about that frame's own
                         # CONTACT NORMAL (its negated outward skin normal) at [friction].half_angle_deg,
                         # frozen at the warm-start pose — the same cone the contact readout's force
                         # witness uses. A patch of skin can then only push the way it faces. false =
                         # free bilateral forces everywhere (the pre-2026-08 behaviour).
overlay = false          # reprojected-keypoint debug overlay → human_optim/kindyn_1_overlay.mp4

#                       root  kin1  kin2   dyn  kindyn1
[loss_weights.kinematic]
reproj_sapiens      = [8, 8, 8, 8]
reproj_init         = [30, 30, 30, 30]
chamfer             = [10, 10, 0, 0]   # OFF in kinematics_2 AND kindyn_1 — both start from the repaired body; chamfer would pull it back toward the (spaghetti-prone) human depth the repair just left
pose_prior          = [300, 300, 300, 300]
orient_prior        = [50, 50, 50, 50]

[loss_weights.motion]
# The tangent differences of q: velocity (1st) → accel (2nd) → jerk (3rd) → snap (4th).
# Weights are tuned at 30 fps. In KINDYN ONLY, per-frame-difference terms (here +
# radial_velocity + ann_velocity + the dynamics smoothness) are scaled ×(fps/30)^2k at
# runtime (identity at ≤30 fps) so the physics term cannot out-muscle them on a high-fps
# clip. The kinematic stages keep raw weights at every fps — scaling them too was measured
# (2026-08-22) to stiffen the kin2 repair and collapse 60 fps contact recall.
# A difference row is dropped where its stencil touches an untracked frame — that frame's
# pose is HELD from its neighbour, so the step across the gap is an artefact, not motion.
velocity_root       = [0, 0, 0, 0]   # OFF — a direct penalty on q̇ damps real motion,
velocity_joint      = [0, 0, 0, 0]   # not just jitter. Measured at 24/48: jitter only
                                                        # -2.3% and contact F1 .578 -> .575. Wired; leave at 0.
# kin1 accel by sweep on 6 scenes (x1 / x4 / x16.7 / x41.7): joint-angle jitter 2.752 ->
# 2.688 -> 2.528 -> 2.354 deg/frame, Cartesian joint accel 7.93 -> 6.88 mm/frame², contact
# F1 flat at .578-.579 and reproj_sapiens +0.05 px. Monotone, no saturation, no cost — the
# old 24/48 was simply far below where this term starts to bite. kin2/kindyn_1 unchanged.
# x16.7 is the shipped point: on all 13 annotated scenes it pairs with radial_velocity 400
# for F1 .488 -> .497 and jitter -8.9% with no scene losing more than .008. Going to
# 1000/2000 together with radial 1500 roughly doubles the smoothing (jitter -15.3%,
# Cartesian accel -27.8%) and still beats baseline (F1 .493), but five scenes move down,
# one by .057 — raise both pairs together if you want that trade.
accel_root          = [24, 400, 24, 24]
accel_joint         = [48, 800, 48, 48]
jerk_root           = [300, 300, 300, 300]   # NOT raised: jerk/snap x4 costs F1 .578 -> .560
jerk_joint          = [500, 500, 500, 500]   # (they were already the dominant smoothness weights)
snap_root           = [300, 300, 300, 300]   # 4th-diff snap on top of accel/jerk — highest-freq root jitter
snap_joint          = [500, 500, 500, 500]
# Damp joint velocity along the viewing ray (worst-constrained axis); kin1 + kin2 + kindyn_1.
# The best smoothing lever measured — it spends its whole budget on the one axis the images
# cannot see. 6-scene ladder x1 / x4 / x15: Cartesian joint accel 7.93 -> 7.09 -> 6.41
# mm/frame², root translation accel 5.70 -> 4.92 -> 4.28, contact F1 .578 -> .584 -> .580,
# reproj_sapiens +0.02 / +0.12 px. 400 shipped (see accel above); kin1 only.
radial_velocity     = [0, 400, 100, 100]

[loss_weights.scene]
# Acts on the 12 CONTACT FRAMES, not on the 1000 subsampled verts (the loss is a mean over
# active points, so ~83× fewer points changed the scale). 12000 by sweep on 4 scenes: residual
# frame penetration 2.3–3.5 → 0.9–1.2 cm (the term's own 1 cm dead-zone edge, i.e. it now
# actually reaches equilibrium) for +0.03…+0.5 px reproj_sapiens vs 4000.
penetration         = [0, 12000, 12000, 12000]   # push the contact frames out of geometry/scene.npz (reported, not a fit gate)

[loss_weights.annotation]
# Label-driven, and in the default chain every label lives on the 12 CONTACT FRAMES:
# kinematics_1 detects them itself (frozen at the refine phase), kinematics_2 + kindyn_1 read
# them from contacts_1 / contacts_2. So these terms act on the contact-frame POINTS. Only the
# metrics-only `labels = "manual"` paths put per-joint labels on the joints and their vertices.
ann_attraction      = [0, 10, 0, 20]   # pull labelled points onto the wall. OFF in kinematics_2 — its mean-over-active-points pull BURIED the body (the front of a limb crosses the wall while the rest keeps pulling); replaced there by ann_acquisition + ann_seating.
ann_acquisition     = [0, 0, 1000, 0]   # kinematics_2: per positive (video frame, contact frame) instance, long-range bounded pull of that ONE point toward a target patch of wall points. 1000 chosen by sweep (per-joint era): seats floaters (gtIGgs euclid med 40.8→5.4 cm) at reproj_sap 9.3→28.8 px; 300 under-seats, 3000 buys little for +6 px.
ann_seating         = [0, 0, 0, 0]   # OFF (2026-07-26): its −5 mm target was itself the burial mechanism — on boulder_1/3 removing it cut mean penetration 2.03→0.51 / 0.93→0.26 mm with TP wall distances matching the manual chain; acquisition's fading pull + the penetration term already seat. Wired, raise to re-enable.
ann_repulsion       = [0, 0, 4000, 4000]   # push no-contact points off — inert unless the labels carry 0s, i.e. `labels = "manual"` only (frame labels are positive-only; arming them via contacts_1 negatives was tried 2026-07-26 and only added jitter)
ann_velocity        = [0, 500, 4000, 4000]   # damp the labelled points' linear + angular velocity — the contact readout gates on pre-enforcement drift_pre, so this cannot vote for its own labels
ann_acceleration    = [0, 0, 0, 0]   # OFF — near-redundant with a strong ann_velocity (a still joint is already low-accel); wired + ready, raise to damp in-contact joints' Cartesian (LOCAL_WORLD_ALIGNED) acceleration if ann_velocity is lowered to allow slow sliding contacts

# The physics terms of kindyn_1's joint engine. All-LINEAR weights; every residual is
# first divided by BODY WEIGHT and averaged over the counted frames — so these numbers are
# dimensionless and mean the same thing on a 60-frame clip and a 900-frame one.
#
# 2026-08-30 smoothness update (13-clip ./data sweep, 12 settings; jitter = mean par/perp
# force difference at orders 1/2/3 over persisting contacts, residual RMS in body-weight
# units with the angular rows on a 0.2 m lever). Two changes, tuned together:
#
#  - Root residual split lin/ang and tilted 50/300. The friction cones block moment
#    authority, so the angular rows were the dominant residual (0.47 vs 0.11 BW) at the
#    old equal weighting. The tilt buys ang 0.47 -> 0.22 for lin 0.11 -> 0.17 — the
#    sanctioned trade (more linear residual for less angular). ang=600 keeps falling
#    (0.14) but jitter worsens and lin hits 0.18 — 300 is the knee.
#  - 2nd/3rd-order force smoothness. With 1st differences only, order-2 jitter ~= order-1
#    (pure frame-to-frame alternation the pair term cannot kill without flattening real
#    load changes). At (160,80)+(80,40) with the tilt: j1 -39%, j2 -70%, j3 -83% for
#    +0.002 residual; reprojection flat (13.19 -> 13.03 px mean), best-of-sweep snap, and
#    load peaks NOT flattened (per-frame totals stay 1.1-1.5 BW mean, maxima survive).
#    60 fps clips win the most — the (fps/30)^2k weight scaling puts the effective orders
#    at x4/x16/x64 there, which is exactly what 2nwG's shake needed.
#
# The pre-split base_wrench=100 ladder (2026-08-12) and the 40/20 first-order sweep note
# (2026-08-25) live in git history; both fed the values below.
[loss_weights.dynamics]
base_wrench         = [0, 0, 0, 50]   # LINEAR rows of the root residual (N)
base_wrench_ang     = [0, 0, 0, 300]  # ANGULAR rows (N·m) — the moment residual, weighted on its own
force_magnitude     = [0, 0, 0, 1]
force_smooth_mag    = [0, 0, 0, 120]   # smooth the force MAGNITUDE across persisting contacts (harder than direction)
force_smooth_dir    = [0, 0, 0, 60]   # smooth the force DIRECTION (may adapt faster than magnitude)
# 2nd/3rd-order force smoothness: the same magnitude/direction split on the 2nd and 3rd
# finite differences (force acceleration and jerk), masked to contacts that persist over
# the whole 3-/4-frame window.
force_accel_mag     = [0, 0, 0, 640]
force_accel_dir     = [0, 0, 0, 320]
force_jerk_mag      = [0, 0, 0, 400]
force_jerk_dir      = [0, 0, 0, 200]
# Joint-torque terms (2026-09-06), all weighted per joint by [torque.multipliers] and read
# in body-weight units at a 1 m lever (τ / body weight). torque_magnitude is the effort
# cost that resolves the statically indeterminate hands-vs-feet split — a load the body
# could carry with either limb goes where the weighted torque is cheapest. climb_wall_2
# sweep (7 trials vs the per-limb boards, pose unchanged in every run): hands/feet mean
# force 1.36 (boards 0.90) at 0 -> 1.19 at 1 -> 1.12 at 3 -> 1.03 at 10 -> 0.94 at 30;
# MAE 84.6 -> 76.7 N and the load-share error 5.1 -> 1.7 pp at 10, where the leftover
# root force is 6 % of body weight (2 % before; 9 % at 30, which also overshoots). It
# rebalances partly by lowering the hands, not only by loading the feet. torque_smooth /
# torque_accel are the 1st / 2nd differences of the same weighted torque; 40 / 160 cut
# torque jitter 26 / 25 -> 16 / 11 N·m for ~2 % BW of root residual (the old
# torque_smooth = 10 was unweighted and well below where it bites). 15 / 40 / 160 shipped.
# 2026-09-09: force smoothness doubled (80/40, 320/160, 160/80) and torque smoothness cut
# (40/160 -> 15/60) — the torques were over-smoothed while the forces still shook. 13 out/
# scenes + climb_wall_2: force jitter d1/d2/d3 -14/-23/-29 %, torque jitter +4/+11 %, root
# residual 0.210 -> 0.196 BW, pose moves 4.7 mm; boards MAE 77.7 -> 76.0 N, corr .672 -> .684,
# limb-force step |df| 10.4 -> 8.9 N (the boards themselves: 6.1).
# 2026-09-11 round 3: force smoothness up again, weighted to the higher orders (120/60,
# 640/320, 400/200), torque smoothness cut to 8/30, torque_magnitude 15 -> 30 for more load
# on the feet. Steeper [torque.multipliers] (table^1.5 / table^2) were tried on climb_wall_2
# and overshoot the boards (hands/feet 0.75 / 0.47 vs 0.90 measured, MAE 86 / 106 N), so the
# table stays. 13 out/ scenes: force jitter d1/d2/d3 -16/-27/-35 %, torque jitter -7/-2 %
# (smoother forces need fewer torque corrections), root residual 0.196 -> 0.217 BW, force
# confidence .75 -> .71, hands/feet 2.47 -> 2.29, pose 4.7 mm. climb_wall_2: hands/feet
# 1.01 -> 0.96 (boards 0.90), share error 1.5 -> 0.8 pp, limb |df| 8.9 -> 8.1 N, MAE 76.0 -> 78.6 N.
torque_magnitude    = [0, 0, 0, 30]
torque_smooth       = [0, 0, 0, 8]
torque_accel        = [0, 0, 0, 30]

# Per-joint multipliers of the three torque terms, keyed by joint group (the joint name
# without its side and index: left_hip -> hip, spine2 -> spine, right_index3 -> index).
# Proposal B: 200 N·m divided by the joint's published maximum voluntary torque (young
# adults; Anderson 2007 for hip/knee/ankle, standing-flexion data for shoulder/elbow,
# wrist-moment and finger-flexor studies for the hand), so a torque costs more the weaker
# the joint. Legs and trunk = 1; the hand chain is where strength falls off a cliff.
[torque.multipliers]
hip = 1.0
knee = 1.0
ankle = 1.7
foot = 1.7
spine = 1.0
neck = 6.0
head = 6.0
collar = 2.5
shoulder = 2.5
elbow = 3.3
wrist = 17.0
index = 25.0
middle = 25.0
ring = 25.0
pinky = 25.0
thumb = 25.0

[optimizer]
lr = 0.01
lr_decay = 0.1
lr_lbfgs = 1.0
lbfgs_history = 10

[chamfer]
sat_m = 0.25           # saturate per-point distances at sat_m*tanh(d/sat_m): near the body it is
                       # the identity (shipped calibration untouched), far depth outliers stop
                       # pulling (gradient fades to 0) instead of dragging with constant force.
                       # The prefit's GM chamfer + both reproj terms already carry this lesson.
                       # A/B 2026-08-25 (6 scenes): pooled F1 .762 vs .760 off, boulder_1 +.022,
                       # jitter unchanged — outlier immunity at zero climbing cost. 0 = off.
conf_drop_q = 0.3      # PER-FRAME quantile: drop each frame's lowest-confidence depth fraction (human cloud un-gated at fuse)
max_points = 1500
vertex_subsample = 1000
chunk = 16
emphasis_lo = 0.1      # per-vertex chamfer weight floor (torso); log-mapped. (0.1/10.0/1.0) reproduces the base field
emphasis_hi = 10.0     # per-vertex chamfer weight ceiling (hands/feet)
emphasis_radius = 1.0  # geodesic falloff scale (m); smaller = emphasis hugs the extremities
sampling = "limb_quota"    # human-cloud cap: "limb_quota" (default — group-aware conf gate + guaranteed hand/foot quotas; grouping = nearest projected init joint in px) | "stride" (uniform, the pre-round-12 path)
limb_quota = 200       # sampling="limb_quota": max points each hand/foot group keeps before the rest fills max_points

[keypoints]
score_thresh = 0.3
include_hands = true    # 10 fingertip landmarks (Sapiens ~0.3–0.7 conf on climbers). Measured on 4
                        # scenes: fingertip 2D −23…−42%, wrist up to −13%, hand-frame contacts +4%,
                        # ≤0.25 px cost on head/feet. false = the hands have no image witness at all.
gm_scale_px = 40.0
smooth_window_s = 0.35  # SG-smooth the Sapiens TARGET tracks (s) before opt; loss sees smoothed, gate measured vs RAW. 0 = off

[reproj_init]
gm_scale_px = 30.0
smooth_window_s = 0.35  # same SG smoothing for the init-anchor TARGET tracks; the reproj_init gate is still vs RAW. 0 = off

# Occlusion-aware down-weighting of the visual terms in kinematics_1. A joint the body
# hides jitters because the two things that hold it — the Sapiens 2D keypoint and the
# converter starting pose — are both guesses there. So weight reproj_sapiens, reproj_init
# and pose_prior by a per-joint VISIBILITY, leaving the contact terms free to hold that
# joint still instead. Visibility = the keypoint's Sapiens detection score, smoothed
# ([keypoints].smooth_window_s) and divided by its own 90th percentile over the clip (so it
# measures the score's DROP, not the detector's per-joint calibration); joints with no
# keypoint inherit their parent's. Measured against an exact ray cast on 4 scenes: mean
# score 0.905 clear vs 0.614 occluded.
[occlusion]
strength = 0.0   # weight = 1 - strength*(1 - ratio), clamped to [0,1]. 0 = off.

[penetration]
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding); the quantile gate below does the work
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
margin_m = 0.01
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02
prune_margin_m = 0.30
max_candidates = 6000
normal_k = 16

[ann_attraction]
conf_thresh = 0.1
band_m = 0.30
max_dist_m = 0.30

# kinematics_2 contact-patch repair (ann_acquisition + ann_seating). A contact label means SOME
# surface point of the group touches the wall, so per positive (frame, annotation-group) instance
# ONE closest vertex is pulled — not the whole Voronoi patch. Patches are built once per phase:
# scene points whose projection lands within radius_px of the group's member-vertex pixel
# footprint (confident, in front of camera), the patch_k nearest in 3D.
[ann_acquisition]
radius_px = 60         # target-patch pixel footprint around the group's member verts
patch_k = 64           # target points kept per instance (nearest in 3D to the member centroid)
delta_m = 0.10         # pseudo-Huber knee: bounded ~constant pull beyond it, quadratic fade to 0 within
conf_thresh = 0.1      # scene-point confidence floor for a patch point
# NOTE: confidence-weighting the pull per instance was tried (2026-07-26) and REFUTED: on a
# floating body the witnesses report ~0 confidence for TRUE contacts (gtIGgs medians .07–.34),
# so weighting kills exactly the repair this stage exists for (body stays 30 cm off the wall) —
# while boulder_1's FALSE positives sit at confidence .92 and keep pulling anyway.

# Near-field seat: drive the acquisition vertex's patch-plane signed distance to target_m
# (slight penetration), symmetric so it pushes back out after overshoot; active within ±band_m.
[ann_seating]
target_m = -0.005      # seat 5 mm inside the wall (slight penetration per spec)
band_m = 0.10          # seating engages only within this of the surface (acquisition owns beyond)
huber_m = 0.01         # Huber knee on |s - target_m|

[ann_repulsion]
conf_thresh = 0.1
clearance_m = 0.03
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02

# Contact velocity damper. The ann_velocity weight damps an in-contact joint's LINEAR
# world velocity; angular_weight adds its ANGULAR velocity (world-orientation change) at
# this fraction of the linear weight. A gripping joint should not twist, but holding
# position matters more (metres vs a dimensionless quaternion distance), so keep it small.
# Applies to both kinematics_1 and kinematics_2.
[ann_velocity]
angular_weight = 0.1

# kin1 auto-contact frozen-label DETECTOR + attraction pull band (looser enter/exit than the readout).
# Detection runs on the 12 CONTACT FRAMES (toes/heels/knees/palms/fingertips), never on joints.
# GUARD: max_dist_m must exceed band_m AND detect_exit_m, and prune_margin_m >= max_dist_m, or detections die silently.
[auto_contact]
detect_thresh_m = 0.08   # enter: a still contact frame within this of the wall becomes a label
detect_exit_m   = 0.12   # stay (hysteresis); >= detect_thresh_m
band_m = 0.15            # attraction pull range for a labeled contact frame
max_dist_m = 0.25        # guard; > band_m and > detect_exit_m
prune_margin_m = 0.30    # nearest-neighbour AABB prune; >= max_dist_m
conf_thresh = 0.1
# window_s / still_m are NOT set here: the kin1 detector inherits [contact_gate], so "still"
# means one thing everywhere and one knob moves both.

# Stillness gate: a contact frame is "still" when its NET drift over a ~1/3 s window is small
# (separates a gripping hand's mm-jitter from a slow near-wall pass). still_m = drift at stillness 0.5.
[contact_gate]
window_s = 0.35        # drift window (~11 frames at 30 fps)
still_m  = 0.04        # THE recall knob (raise → more recall), shared by the kin1 detector and the readout
# Closeness that OUTRANKS stillness — and duration: a frame whose guarded signed distance is
# below this stays contact evidence even while moving fast, and a span pressing below it survives
# the duration rules (the 3-frame blip killer and the post-weld min_span) however brief. A
# sprinting foot plant presses into the floor but can never look still — the drift window
# straddles the swing — and a one-frame bounce is real contact, not flicker. ONE value for both
# sports since 2026-08-25: the 13-scene climbing A/B (with min_span_s 0.06) took pooled F1
# .729 -> .768 — sport_climb's fast rope-climbing steps alone went .27 -> .62; the stillness
# gate had been killing real presses there too. -1 = off.
# In the READOUT stage this exception is additionally held to a load check
# ([contact_force].confirm_bw): a pressing-but-moving step keeps it only where the force
# solve confirms it carries weight, or was muted. The kin1 auto-label detector runs before
# any solve exists, so there the exception stands on its own, as always.
still_override_m = 0.01

[contacts]
frames = []            # contact-frame allowlist by NAME; empty = every frame the body carries.
                       # Read wherever the chain builds the body (kin1 / kin2 / kindyn + this
                       # stage), so a recipe that restricts it (peter: hands + feet only)
                       # restricts detection, labels and forces in one move.
overlay = false        # render the contact overlay
close_thresh_m = 0.03  # enter: "just outside" distance counted as contact (the 0.02 tried
                       # 2026-08-30 became a wash once the load check took over the precision
                       # work: +.002 precision for -.002 recall on the annotated corpus)
exit_thresh_m = 0.035  # stay: looser hysteresis exit (holds a span, kills 1-frame boundary flicker)
min_span_s = 0.1       # min contact/release span (seconds; frames = ceil(s·fps)) — applied to
                       # the fused labels AFTER gap-welding; raw detection keeps a fixed 3-frame
                       # blip killer (DETECT_MIN_FRAMES). Back to 0.1 from the 0.06 athletics
                       # unification (2026-08-30: 0.06 was strictly worse on the annotated
                       # corpus, and a surviving press is exempt from the rule anyway — the
                       # sprint stance the 0.06 existed for is a loaded press)
max_dist_m = 0.10
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding)
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
# A contact frame's own normal is NOT a gate — scene points and pose are too noisy to veto on.
# It is used in one place only, with no knob: when both toe frames of a foot are candidates,
# the one looking more into the wall wins and the other is dropped (the sole-side toe frame —
# toe_under in the legacy set, big_toe in better_contacts — vs toe_above).
normal_k = 16
prune_margin_m = 0.10
# span-merge: bridge a short same-frame gap the point barely moved across AND stayed near the wall
# throughout; the re-grip guard (merge_sdf_m) blocks leave-and-return. merge_dist_m = 0 disables.
merge_dist_m = 0.03    # max endpoint displacement across the gap (m)
merge_max_gap_s = 2.0  # only bridge gaps shorter than this (s)
merge_sdf_m = 0.08     # re-grip guard: it stayed within this signed distance of the wall the whole gap

# The FORCE WITNESS in the contact readout. The detector above needs a contact frame to be
# near the scene; when the reconstruction puts the body in the wrong place that never
# happens and the contact is lost. So the stage also asks physics: with the pose frozen,
# inverse dynamics says what force the body still needs to move the way it does, and the
# solve finds the world forces at the 12 contact frames that explain it — each one confined
# to a 45 degree friction cone about that patch of skin, so a frame can only explain what it
# is oriented to explain. A frame that has to carry theta_bw of the body's weight is called
# in contact, and that label is UNIONED onto the geometric one (add-only, never removes).
# The SAME solve is also read the other way round (confirm_bw): the geometric arm's
# penetration exception — a pressing-but-MOVING frame — must carry load where the solve was
# heard. Everything else about the solve is a fixed, measured choice in the code, not a knob.
#
# Two frame groups are excluded from force labels in code (no knob): KNEES (their cones
# cannot be trusted; ~all false positives, excluded since the witness shipped) and HEELS
# (2026-08-30: within one foot the solve's load split is indeterminate — a flat foot can
# route its whole weight through the ball — so small solved heel loads say nothing; at
# theta 0.02 heels flooded, ~25% precise, and excluding them took corpus precision
# .883 -> .921). Knees also lose their GEOMETRIC arm in the readout (~15% precise — a knee
# rides near-and-still past the wall all climb), so a knee is never labelled; a real
# kneebar is the known cost.
[contact_force]
theta_bw = 0.02            # fraction of body weight at which a frame counts as loaded
                           # (0.05 -> 0.02 2026-08-30: with heels excluded the lower bar is
                           # nearly free — corpus recall .785 -> .861 for half a point of
                           # precision; at 0.05 the witness left most of what it sees unused)
theta_hold_bw = 0.01       # …and keeps the label until the load drops below this (hysteresis;
                           # set equal to theta_bw for a single threshold)
gap_dstar_m = 0.05         # gap price: force this far from the scene is already expensive
stillness_vstar_mps = 0.2  # stillness price: force on a frame drifting this fast is expensive
# A FAR force label needs stillness (replaces the old absolute label_max_dist_m gate,
# 2026-08-25). Within the detector's own trust radius ([contacts].max_dist_m) load alone
# labels — a fast foot plant that carries weight is a contact. Beyond it geometry is blind,
# so the load claim needs the stillness witness: drift over the [contact_gate] window at
# most far_still_x * still_m. Real far support holds still — the gtIGgs floater (labels at
# a median 44 cm) and a beam routine whose beam cloud sits half a metre off both survive —
# while the mid-air scraps a bad-depth flight parks on flying limbs move fast and are cut
# (high_jump / 1FGkg far floods drop to zero). The bar is 4x looser than the detector's
# still_m because a badly reconstructed body jitters (at 1x, gtIGgs loses half its rescue).
# Measured on the 13 annotated climbing scenes: F1 .729 vs .736 with no rule at all, vs
# .603 with the old 0.20 m gate. One rule, both sports. 0 = off.
far_still_x = 4.0

# THE LOAD CHECK on the penetration exception (2026-08-30). The exception
# ([contact_gate].still_override_m, "a frame pressing into the surface counts however
# fast it moves") exists for the contacts no drift window can call still — a sprint
# plant, a cartwheel hand. But a hand sweeping ALONG the wall presses just as close, and
# the exception cannot tell a plant from a sweep: measured, it costs the geometric arm
# four points of precision on its own. Load can tell them apart — a plant carries
# weight, a sweep carries none — so wherever the solve was heard, a pressing-but-moving
# step keeps its exception only if the solve routes confirm_bw of body weight through
# it. Where the solve explained nothing (mute_res_bw of root residual left — a rope or
# belay carrying the body, a broken trajectory) its silence is not evidence and the
# exception stands untouched. STILL frames never need the solve's blessing.
#
# Two designs measured and refuted on the 118-scene annotated corpus before this one:
# load REPLACING stillness outright (test precision .900 -> .950 but recall .803 -> .743
# — a heel sharing a hold with its own forefoot carries no solvable load of its own),
# and a load override that lets any loaded moving frame in (redundant: theta_bw already
# labels those). The shipped combination: corpus precision .880 -> .922, recall
# .808 -> .860.
confirm_bw = 0.02
mute_res_bw = 0.5

# Per-clip reconstruction-quality FLAGS, computed and saved by estimate_contacts (the
# earliest stage where all three signals exist — the residual comes from its force
# witness) into contacts_<tag>.npz as quality_flag + the raw metrics. Calibrated
# 2026-08-26 against the user's verdict on 23 labelled clips (high_jump / -bUyE / 1FGkg /
# pommel_horse = bad; olympics_2 / balance_beam pass; every climbing scene passes).
# Small dataset — revisit as it grows. The CAMERA flag needs BOTH witnesses: cam/depth
# alone cannot tell a real handheld move (boulder_1 reads 0.71 with coherent physics,
# 1.0 BW) from a hallucinated dolly (1FGkg reads 0.68 with 2.8 BW of inexplicable
# acceleration) — the residual is the tiebreak.
[quality]
cam_depth_max = 0.4        # camera-translation spread / median scene depth above this ...
res_before_bw_max = 2.5    # ... AND median pre-force root residual above this = "camera" flag
smear_med_max = 2.0        # median along-ray human-cloud smear above this = "depth" flag
                           # (same 2.0 as the chamfer smear weight's dead zone — one meaning)

# Label confidence — a trust weight in [0, 1] estimate_contacts saves with every
# contact / no-contact label (frame_label_confidence + the joint_contact fold): the
# per-joint era's source-conditional algebra on the frame axis — visibility ×
# evidence, the evidence capped by the label's source (docs/contact_confidence.md).
# It never changes the binary label.
[contact_confidence]
surface_inner_m = -0.02       # contact band: burial deeper than this is suspect geometry
surface_outer_m = 0.05        # ... and further outside than this is not on the wall
surface_soft_m = 0.01         # softness of both band edges
penetration_floor = 0.40      # deep burial keeps at least this fraction of surface evidence
motion_scale_mps = 0.10       # no-contact: net speed where motion evidence saturates (far)
motion_near_scale_mps = 0.15  # ... inflated near the wall (suppresses slow drift)
motion_near_power = 3.0       # ... with a steeper (cubic) response there
image_margin_px = 10.0        # soft image border of the visibility term
occ_margin_m = 0.05           # body-occlusion gap where visibility halves
occ_soft_m = 0.01             # ... and its softness
# The three ceilings. The two arms kept their original roles after the 2026-08-30
# rework (geometry = near-and-still decides, the force witness adds rescues and checks
# the penetration exception), so the caps keep their original ordering: a corroborated
# label is trusted most, a lone force rescue is positionally uncertain, a lone
# geometric label is merely unconfirmed.
gate_only_cap = 0.50          # geometry alone
gate_force_cap = 0.85         # ... lifted to this when the solved load agrees
force_only_cap = 0.70         # the force witness alone: a misregistration rescue
force_share_scale = 0.25      # |f|/body-weight where the force ramp saturates
nodata_cap = 1.0              # no-contact cap with an absent depth witness — OFF (premise refuted)
nodata_force_cap = 1.0        # ... lifted where the solve allocates ~no force — OFF

# Depth-fit trust — how well the local body fit agrees with the human depth cloud;
# scales the motion (no-contact) evidence so a stretched limb cannot fake a
# trustworthy "it moved".
[depth_fit]
cell_px = 8                # z-buffer cell size (px) for cloud↔mesh ray matching
min_points = 5             # fewer matched cloud points than this = no depth witness
trust_scale_log = 0.05     # log-depth-ratio scale of the trust falloff

[friction]
half_angle_deg = 45.0   # μ = tan(45°) = 1

[dynamics_optimizer]
max_iter = 200
history_size = 20
lr = 1.0
tolerance_grad = 1e-9
tolerance_change = 1e-12

[runtime]
device = "cuda"
