# human_optimization — one config, five stages.
# Loss-weight rows are per-stage arrays, columns = [root, kinematics_1, kinematics_2, dynamics, kindyn_1].
# Scene/annotation terms apply only in a stage's refine phase (the body seats first).
# kindyn_1 = joint kinematics + dynamics: its kinematic columns copy kinematics_2, and it
# turns on the dynamics terms too. kindyn_1 weights are LINEAR (0.5·Σresidual² times the
# weight, like every engine term); the dynamics stage puts base_wrench/force_magnitude INSIDE
# the square, so for those two a kindyn weight w matches a dynamics weight √w.

[stages]
run = ["root", "kinematics_1"]   # default chain; kinematics_2 (needs annotations) + dynamics are opt-in

[stages.root]
iters = { root = 150 }

[stages.kinematics_1]
# kin1 auto-contacts: labels detected ONCE at the refine phase (readout at the [auto_contact] point),
# frozen, then drive the attraction (ann_attraction). ann_attraction[kin1]=0 gives a pure visual fit.
iters = { full = 300, refine = 200, lbfgs = 30 }
overlay = false          # reprojected-keypoint debug overlay → human_optim/kinematic_1_overlay.mp4

[stages.kinematics_2]
iters = { root = 20, full = 80, refine = 250, lbfgs = 30 }
overlay = false          # debug overlay → human_optim/kinematic_2_overlay.mp4
labels = "manual"        # contact labels: "manual" (data/<stem>.npz) | "auto" (contacts_1, confidence-weighted)

[stages.dynamics]
device = "cuda"          # GPU: the new BetterRobot batched-adjoint torch RNEA is fast (warp measured slower for this fwd+bwd solve)
bodies = "kinematic_1"   # which refined body the force solve reads (kinematic_1 | kinematic_2)

[stages.kindyn_1]
# Joint kinematics + dynamics. Starts from the converged kinematic_2 body + its manual contact
# annotation (data/<stem>.npz) and optimizes pose AND per-contact-group forces together, so the
# RNEA base wrench can reshape the motion instead of only being absorbed by forces. Forces are
# warm-started (a frozen-q solve, [dynamics_optimizer] knobs), then ONE joint L-BFGS phase
# fine-tunes pose + forces together — Adam was tried and is destructive here (it cannot
# co-adapt N-scale forces to a moving pose; the wrench spikes and the motion wrecks). No
# friction cones in this first version (as q moves the precomputed scene normals go stale).
iters = { lbfgs = 150 }  # one joint L-BFGS polish (pose + forces); Adam can't co-adapt N-scale forces
labels = "manual"        # manual contact annotation only — no auto labels, no contact detection
overlay = false          # reprojected-keypoint debug overlay → human_optim/kindyn_1_overlay.mp4

#                       root  kin1  kin2   dyn  kindyn1
[loss_weights.kinematic]
reproj_sapiens      = [   8,    8,    8,    0,    8 ]
reproj_init         = [  30,   30,   30,    0,   30 ]
chamfer             = [  10,   10,   10,    0,   10 ]
pose_prior          = [ 300,  300,  300,    0,  300 ]
orient_prior        = [  50,   50,   50,    0,   50 ]

[loss_weights.motion]
accel_root          = [  24,   24,   24,    0,   24 ]
accel_joint         = [  48,   48,   48,    0,   48 ]
jerk_root           = [ 300,  300,  300,    0,  300 ]
jerk_joint          = [ 500,  500,  500,    0,  500 ]
snap_root           = [ 300,  300,  300,    0,  300 ]   # 4th-diff snap on top of accel/jerk — highest-freq root jitter
snap_joint          = [ 500,  500,  500,    0,  500 ]
radial_velocity     = [   0,  100,  100,    0,  100 ]   # damp joint velocity along the viewing ray (worst-constrained axis); kin1 + kin2 + kindyn_1

[loss_weights.scene]
penetration         = [   0, 4000, 4000,    0, 4000 ]   # push posed verts out of geometry/scene.npz (reported, not a fit gate)

[loss_weights.annotation]
# Label-driven; labels are AUTO-detected in kinematics_1 (frozen), MANUAL in kinematics_2 + kindyn_1.
ann_attraction      = [   0,   10,   20,    0,   20 ]   # pull in-contact-joint verts onto the wall (UNBOUNDED pull — stays small; ≥100 diverges the fit)
ann_repulsion       = [   0,    0, 4000,    0, 4000 ]   # push no-contact verts off — MANUAL only (auto labels carry no negatives)
ann_velocity        = [   0,  500, 4000,    0, 4000 ]   # damp in-contact joints' linear + angular velocity (readout reads pre-enforcement drift_pre)
ann_acceleration    = [   0,    0,    0,    0,    0 ]   # OFF — near-redundant with a strong ann_velocity (a still joint is already low-accel); wired + ready, raise to damp in-contact joints' Cartesian (LOCAL_WORLD_ALIGNED) acceleration if ann_velocity is lowered to allow slow sliding contacts

# dynamics column = the standalone frozen-q force stage (base_wrench + force_magnitude INSIDE
# the square, smoothness linear). kindyn_1 column = all-LINEAR weights for the same terms in
# the joint engine. Tiny base_wrench because the wrench is O(10³ N) vs kinematic O(1–10²): at
# weight 1 it would swamp the visual fit. The smoothness ratios to base match the dynamics
# stage exactly; force_magnitude (0.01 of base, linear) is ~100× heavier relative to base than
# the dynamics stage's effective 0.01² — it only shapes the force warm-start, and the tuned
# result met its targets, so it stays.
[loss_weights.dynamics]
base_wrench         = [   0,    0,    0,  1.0,  1e-5 ]
force_magnitude     = [   0,    0,    0, 0.01,  1e-7 ]
force_smooth_mag    = [   0,    0,    0, 0.20,  2e-6 ]   # smooth the force MAGNITUDE across persisting contacts (harder than direction)
force_smooth_dir    = [   0,    0,    0, 0.05,  5e-7 ]   # smooth the force DIRECTION (may adapt faster than magnitude)
torque_smooth       = [   0,    0,    0, 0.10,  1e-6 ]

[optimizer]
lr = 0.01
lr_decay = 0.1
lr_lbfgs = 1.0
lbfgs_history = 10

[chamfer]
conf_drop_q = 0.3      # PER-FRAME quantile: drop each frame's lowest-confidence depth fraction (human cloud un-gated at fuse)
max_points = 1500
vertex_subsample = 1000
chunk = 16
emphasis_lo = 0.1      # per-vertex chamfer weight floor (torso); log-mapped. (0.1/10.0/1.0) reproduces the base field
emphasis_hi = 10.0     # per-vertex chamfer weight ceiling (hands/feet)
emphasis_radius = 1.0  # geodesic falloff scale (m); smaller = emphasis hugs the extremities
sampling = "limb_quota"    # human-cloud cap: "limb_quota" (default — group-aware conf gate + guaranteed hand/foot quotas; grouping = nearest projected init joint in px) | "stride" (uniform, the pre-round-12 path)
limb_quota = 200       # sampling="limb_quota": max points each hand/foot group keeps before the rest fills max_points

[keypoints]
score_thresh = 0.3
include_hands = false
gm_scale_px = 40.0
smooth_window_s = 0.35  # SG-smooth the Sapiens TARGET tracks (s) before opt; loss sees smoothed, gate measured vs RAW. 0 = off

[reproj_init]
gm_scale_px = 30.0
smooth_window_s = 0.35  # same SG smoothing for the init-anchor TARGET tracks; the reproj_init gate is still vs RAW. 0 = off

[penetration]
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding); the quantile gate below does the work
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
margin_m = 0.01
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02
prune_margin_m = 0.30
max_candidates = 6000
normal_k = 16

[ann_attraction]
conf_thresh = 0.1
band_m = 0.30
max_dist_m = 0.30

[ann_repulsion]
conf_thresh = 0.1
clearance_m = 0.03
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02

# Contact velocity damper. The ann_velocity weight damps an in-contact joint's LINEAR
# world velocity; angular_weight adds its ANGULAR velocity (world-orientation change) at
# this fraction of the linear weight. A gripping joint should not twist, but holding
# position matters more (metres vs a dimensionless quaternion distance), so keep it small.
# Applies to both kinematics_1 and kinematics_2.
[ann_velocity]
angular_weight = 0.1

# kin1 auto-contact frozen-label DETECTOR + attraction pull band (looser enter/exit than the readout).
# GUARD: max_dist_m must exceed band_m AND detect_exit_m, and prune_margin_m >= max_dist_m, or detections die silently.
[auto_contact]
groups = ["left_hand", "right_hand", "left_foot", "right_foot"]
detect_thresh_m = 0.08   # enter: a still joint within this of the wall becomes a label
detect_exit_m   = 0.12   # stay (hysteresis); >= detect_thresh_m
min_frames = 3
band_m = 0.15            # attraction pull range for a labeled joint's vertices
max_dist_m = 0.25        # guard; > band_m and > detect_exit_m
prune_margin_m = 0.30    # scene_sdf AABB prune; >= max_dist_m
conf_thresh = 0.1
still_m = 0.025          # DETECTOR stillness, decoupled from [contact_gate].still_m; omit to inherit it

# Readout stillness gate: a joint is "still" when its NET drift over a ~1/3 s window is small
# (separates a gripping hand's mm-jitter from a slow near-wall pass). still_m = drift at stillness 0.5 = recall knob.
[contact_gate]
window_s = 0.35        # drift window (~11 frames at 30 fps)
still_m  = 0.03        # readout net-drift recall knob (raise → more recall); the kin1 DETECTOR pins its own in [auto_contact]

[contacts]
overlay = true             # render the contact skeleton overlay
close_thresh_m = 0.03  # enter: "just outside" distance counted as contact
exit_thresh_m = 0.035  # stay: looser hysteresis exit (holds a span, kills 1-frame boundary flicker)
min_frames = 3         # drop contact spans shorter than this many frames
max_dist_m = 0.10
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding)
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
normal_k = 16
prune_margin_m = 0.10
# span-merge: bridge a short same-joint gap the joint barely moved across AND stayed near the wall throughout;
# the re-grip guard (merge_sdf_m) blocks leave-and-return. merge_dist_m = 0 disables.
merge_dist_m = 0.03    # max endpoint displacement across the gap (m)
merge_max_gap_s = 2.0  # only bridge gaps shorter than this (s)
merge_sdf_m = 0.08     # re-grip guard: it stayed within this signed distance of the wall the whole gap

[depth_fit]
cell_px = 8          # coarse z-buffer cell at original video resolution
min_points = 5       # minimum matched cloud points for a finite joint gap
trust_scale_log = 0.05  # trust = exp(-(median log-depth-ratio / scale)^2)

# Continuous confidence in each FINAL per-joint contact/no-contact label.
# The compact formula and units are documented in docs/contact_confidence.md.
[contact_confidence]
surface_inner_m = -0.02 # contact evidence fades when the body is implausibly deep inside the wall
surface_outer_m = 0.05  # contact evidence fades beyond this outside distance
surface_soft_m = 0.01   # sigmoid softness for outside distance and penetration reliability
penetration_floor = 0.40 # deeply buried contact stays uncertain, but is not erased by noisy scene normals
motion_scale_mps = 0.10 # far-wall speed scale for no-contact motion evidence
motion_near_scale_mps = 0.15 # scale reached smoothly inside the 5 cm contact band
motion_near_power = 3.0 # response rises smoothly from linear far away to cubic near the wall
image_margin_px = 10.0  # visibility ramps continuously from image edge to this margin
occ_perp_m = 0.02       # body vertices within this camera-ray radius can occlude a joint
occ_front_m = 0.005     # vertex must be at least this far in front; small enough to catch palm/finger overlap
occ_subsample = 2500    # deterministic body-vertex sample used by the occlusion count
occ_full = 5.0          # 3-D visibility reaches exactly zero at this occluding-vertex count

# Force application points for the dynamics stage: two hands (wrist + fingers folded
# onto the wrist), two feet, two ankles — six joints. A joint carries a force only on
# frames it is labelled in contact. Body mass + inertia come baked from BetterHuman.
[contact]
groups = ["left_hand", "right_hand", "left_foot", "right_foot", "left_ankle", "right_ankle"]

# Friction cone for the non-hand contact groups (feet + ankles). A foot/ankle contact can
# only PUSH along the surface normal and its sideways (tangential) force is capped at μ·(normal
# force), μ = tan(half_angle_deg). Enforced BY CONSTRUCTION, not by a loss: the force is built
# as a nonnegative combination of the cone's four pyramid edge directions, so it cannot leave
# the cone and there is no weight to tune. The normal is read from the fused scene cloud:
# average the stored normals of the normal_k nearest scene points to the joint (they point out
# of the wall toward the climber). A joint whose nearest scene point is beyond max_dist_m — or
# whose neighboring normals disagree (they average to ~nothing on thin holds / concave
# corners) — gets a free bilateral force instead, like a hand. Ankle centers sit a few cm
# inside the leg, so keep max_dist_m generous. Comment out this section to run without cones.
[friction]
half_angle_deg = 45.0   # μ = tan(45°) = 1
normal_k = 16
max_dist_m = 0.30

[dynamics_optimizer]
max_iter = 200
history_size = 20
lr = 1.0
tolerance_grad = 1e-9
tolerance_change = 1e-12

[runtime]
device = "cuda"
