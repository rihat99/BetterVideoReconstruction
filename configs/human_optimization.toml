# human_optimization — one config, four stages.
# Loss-weight rows are per-stage arrays, columns = [root, kinematics_1, kinematics_2, dynamics].
# Scene/annotation terms apply only in a stage's refine phase (the body seats first).

[stages]
run = ["root", "kinematics_1"]   # default chain; kinematics_2 (needs annotations) + dynamics are opt-in

[stages.root]
iters = { root = 150 }

[stages.kinematics_1]
# kin1 auto-contacts: labels detected ONCE at the refine phase (readout at the [auto_contact] point),
# frozen, then drive the attraction (ann_attraction). ann_attraction[kin1]=0 gives a pure visual fit.
iters = { full = 300, refine = 200, lbfgs = 30 }

[stages.kinematics_2]
iters = { root = 20, full = 80, refine = 250, lbfgs = 30 }

[stages.dynamics]
device = "cpu"

#                       root  kin1  kin2  dyn
[loss_weights.kinematic]
reproj_sapiens      = [   8,    8,    8,    0 ]
reproj_init         = [  30,   30,   30,    0 ]
chamfer             = [  10,   10,   10,    0 ]
pose_prior          = [ 300,  300,  300,    0 ]
orient_prior        = [  50,   50,   50,    0 ]

[loss_weights.motion]
accel_root          = [  24,   24,   24,    0 ]
accel_joint         = [  48,   48,   48,    0 ]
jerk_root           = [ 300,  300,  300,    0 ]
jerk_joint          = [ 500,  500,  500,    0 ]
snap_root           = [ 300,  300,    0,    0 ]   # 4th-diff snap on top of accel/jerk — highest-freq root jitter
snap_joint          = [ 500,  500,    0,    0 ]
radial_velocity     = [   0,  100,    0,    0 ]   # damp joint velocity along the viewing ray (worst-constrained axis); kin1 only

[loss_weights.scene]
penetration         = [   0, 4000, 4000,    0 ]   # push posed verts out of geometry/scene.npz (reported, not a fit gate)

[loss_weights.annotation]
# Label-driven; labels are AUTO-detected in kinematics_1 (frozen), MANUAL in kinematics_2.
ann_attraction      = [   0,   10,   20,    0 ]   # pull in-contact-joint verts onto the wall
ann_repulsion       = [   0,    0, 4000,    0 ]   # push no-contact verts off — MANUAL only (auto labels carry no negatives)
ann_velocity        = [   0,  500,  500,    0 ]   # damp in-contact joints' velocity (fit-neutral: readout reads pre-enforcement drift_pre)

[loss_weights.dynamics]
base_wrench         = [   0,    0,    0,  1.0 ]
force_magnitude     = [   0,    0,    0, 0.01 ]
force_smooth        = [   0,    0,    0, 0.02 ]
torque_smooth       = [   0,    0,    0, 0.02 ]

[optimizer]
lr = 0.01
lr_decay = 0.1
lr_lbfgs = 1.0
lbfgs_history = 10

[chamfer]
conf_drop_q = 0.3      # PER-FRAME quantile: drop each frame's lowest-confidence depth fraction (human cloud un-gated at fuse)
max_points = 1500
vertex_subsample = 1000
chunk = 16
emphasis_lo = 0.1      # per-vertex chamfer weight floor (torso); log-mapped. (0.1/10.0/1.0) reproduces the base field
emphasis_hi = 10.0     # per-vertex chamfer weight ceiling (hands/feet)
emphasis_radius = 1.0  # geodesic falloff scale (m); smaller = emphasis hugs the extremities
sampling = "limb_quota"    # human-cloud cap: "limb_quota" (default — group-aware conf gate + guaranteed hand/foot quotas; grouping = nearest projected init joint in px) | "stride" (uniform, the pre-round-12 path)
limb_quota = 200       # sampling="limb_quota": max points each hand/foot group keeps before the rest fills max_points

# Physics-gated limb de-smear: a two-pass kinematics_1. Pass 1 is
# the standard fit; then per frame the gate flags a body that is BOTH still (median-joint
# drift_pre < still_m) AND floating (min-over-EE contacts-style jsdf > gap_cm) — physically
# impossible, so its depth is provably wrong. De-smearing is STRETCH-level: a contiguous still
# run holding >= min_flag_frames flagged frames is corrected on EVERY frame (one majority-vote
# closest-EE limb per stretch), so smoothness stops anchoring flagged frames to uncorrected
# neighbours. The limb's points are trimmed to their deep (wall-side) band [p95(z)-band_m, max],
# the kept band gets d2v chamfer weight band_boost, and a refine+lbfgs pass 2 re-seats the body
# on the corrected cloud. Default on; enabled=false is a byte-identical single-pass no-op.
[desmear]
enabled = true        # default on; false => single-pass kinematics_1 (bit-exact pre-round-12 path)
still_m = 0.04         # gate: per-frame median-over-joints drift_pre below this = "still"
gap_cm = 8.0           # gate: per-frame min-over-EE-joints signed jsdf above this = "floating"
band_m = 0.12          # de-smear: keep g*-limb cloud points with camera depth z >= p95(z) - band_m
min_flag_frames = 3    # a still stretch de-smears only if it holds at least this many flagged frames
band_boost = 5.0       # d2v chamfer weight on the kept wall-side band points (others 1.0)
anchor_relax = 0.1     # pass-2 scale on init-anchor + joints pose prior on stretch frames (gate refutes the converter pose there); 1.0 = off
stretch_dilate = 5     # stretch = flagged span dilated this many frames each way, clipped to its still run (bounds the trim to the flagged evidence)

[keypoints]
score_thresh = 0.3
include_hands = false
gm_scale_px = 40.0
smooth_window_s = 0.35  # SG-smooth the Sapiens TARGET tracks (s) before opt; loss sees smoothed, gate measured vs RAW. 0 = off

[reproj_init]
gm_scale_px = 30.0
smooth_window_s = 0.35  # same SG smoothing for the init-anchor TARGET tracks; the reproj_init gate is still vs RAW. 0 = off

[penetration]
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding); the quantile gate below does the work
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
margin_m = 0.01
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02
prune_margin_m = 0.30
max_candidates = 6000
normal_k = 16

[ann_attraction]
conf_thresh = 0.1
band_m = 0.30
max_dist_m = 0.30

[ann_repulsion]
conf_thresh = 0.1
clearance_m = 0.03
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02

# kin1 auto-contact frozen-label DETECTOR + attraction pull band (looser enter/exit than the readout).
# GUARD: max_dist_m must exceed band_m AND detect_exit_m, and prune_margin_m >= max_dist_m, or detections die silently.
[auto_contact]
groups = ["left_hand", "right_hand", "left_foot", "right_foot"]
detect_thresh_m = 0.08   # enter: a still joint within this of the wall becomes a label
detect_exit_m   = 0.12   # stay (hysteresis); >= detect_thresh_m
min_frames = 3
band_m = 0.15            # attraction pull range for a labeled joint's vertices
max_dist_m = 0.25        # guard; > band_m and > detect_exit_m
prune_margin_m = 0.30    # scene_sdf AABB prune; >= max_dist_m
conf_thresh = 0.1
still_m = 0.025          # DETECTOR stillness, decoupled from [contact_gate].still_m; omit to inherit it

# Readout stillness gate: a joint is "still" when its NET drift over a ~1/3 s window is small
# (separates a gripping hand's mm-jitter from a slow near-wall pass). still_m = drift at stillness 0.5 = recall knob.
[contact_gate]
window_s = 0.35        # drift window (~11 frames at 30 fps)
still_m  = 0.03        # readout net-drift recall knob (raise → more recall); the kin1 DETECTOR pins its own in [auto_contact]

[contacts]
close_thresh_m = 0.03  # enter: "just outside" distance counted as contact
exit_thresh_m = 0.035  # stay: looser hysteresis exit (holds a span, kills 1-frame boundary flicker)
min_frames = 3         # drop contact spans shorter than this many frames
max_dist_m = 0.10
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding)
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
normal_k = 16
prune_margin_m = 0.10
# span-merge: bridge a short same-joint gap the joint barely moved across AND stayed near the wall throughout;
# the re-grip guard (merge_sdf_m) blocks leave-and-return. merge_dist_m = 0 disables.
merge_dist_m = 0.03    # max endpoint displacement across the gap (m)
merge_max_gap_s = 2.0  # only bridge gaps shorter than this (s)
merge_sdf_m = 0.08     # re-grip guard: it stayed within this signed distance of the wall the whole gap

# Per-joint label confidence (readout-only; estimate_contacts' loader reads this, NOT config.py).
# Confidence in the FINAL binary label, both classes; semantics in tools/human_optim/confidence.py.
[contact_confidence]
close_ref_m  = 0.03    # p_contact = 0.5 at this signed distance to the wall
ramp_m       = 0.03    # close/far sat ramp half-width (m)
far_ref_m    = 0.25    # p_far = 0.5 at this UNGUARDED distance (jsdf); beyond any hold protrusion = carve-safe
still_ref_m  = 0.03    # p_still = 0 at drift >= 2x this
pen_ref_m    = -0.01   # p_pen = 1 by this signed penetration depth (m); firm penetration overrides motion doubt
v_lo         = 0.15    # joint speed (m/s) below which motion says nothing about contact
v_hi         = 0.5     # speed at which no-contact is motion-certain
img_margin_px = 10     # in-frame margin (px) for the visibility gate
occ_ref      = 8.0     # vis: n_occ (occluding body verts) at which the occlusion factor hits 0 (round-11)
det_lo       = 0.4     # vis: Sapiens keypoint score at/below which the detector factor is 0
det_hi       = 0.75    # vis: Sapiens keypoint score at/above which the detector factor is 1
vis_floor    = 0.1     # vis floor — never hard-zero a class on visibility alone
health_cr    = 0.1     # contact_rate below which a body reads as never-touching (floated) => mute far branch
health_hover_cm = 15.0 # median closest-joint dist (cm) at which hover-health -> 0 (round-7 T4)
nan_scene_min_pts = 1000  # a NaN distance counts as "far" only if the scene cloud has >= this many points (round-8 T2c)

[contact]
groups = ["left_hand", "right_hand", "left_foot", "right_foot"]

[inertia]
total_mass_kg = 70.0
density = 1000.0

[dynamics_optimizer]
max_iter = 200
history_size = 20
lr = 1.0
tolerance_grad = 1e-9
tolerance_change = 1e-12

[runtime]
device = "cuda"
