# human_optimization — one config, five stages.
# Loss-weight rows are per-stage arrays, columns = [root, kinematics_1, kinematics_2, dynamics, kindyn_1].
# Scene/annotation terms apply from a stage's refine phase (the body seats first) — except
# kinematics_2, which runs them from its root phase so the contact-patch repair (ann_acquisition
# + ann_seating) acts from the start and the rigid root phase pushes the body toward the wall.
# kindyn_1 = joint kinematics + dynamics: its kinematic columns copy kinematics_2, and it
# turns on the dynamics terms too. kindyn_1 weights are LINEAR (0.5·Σresidual² times the
# weight, like every engine term); the dynamics stage puts base_wrench/force_magnitude INSIDE
# the square, so for those two a kindyn weight w matches a dynamics weight √w.

[stages]
run = ["root", "kinematics_1"]   # default chain; kinematics_2 (needs annotations) + dynamics are opt-in

[stages.root]
iters = { root = 150 }

[stages.kinematics_1]
# kin1 auto-contacts: labels detected ONCE at the refine phase (readout at the [auto_contact] point),
# frozen, then drive the attraction (ann_attraction). ann_attraction[kin1]=0 gives a pure visual fit.
iters = { full = 300, refine = 200, lbfgs = 30 }
overlay = false          # reprojected-keypoint debug overlay → human_optim/kinematic_1_overlay.mp4
labels = "auto"          # the only supported source: the geometric contact-frame detector above.
freeze_fingers = true    # pin the 30 finger quaternions at their converter values — the finger
                         # joints carry the two fingertip contact frames but are not fitted.
                         # Set false to FIT the hand pose; only meaningful together with
                         # [keypoints].include_hands = true, which gives the fingertips a 2D witness.
finger_smooth_s = 0.2    # Gaussian sigma (SECONDS) for smoothing that frozen finger trajectory over
                         # time. The converter estimates the hand per frame, so it jitters (measured
                         # 1.5-3.7 deg/frame), and freezing keeps the jitter. 0.2 s removes ~90% of it
                         # and leaves the body fit and the fingertip 2D residual unchanged. 0 = off.

[stages.kinematics_2]
# Contact-patch repair. Both knobs matter: the acquisition WEIGHT sets the pull's force balance
# against reproj/priors (its far gradient is weight·delta_m), while ITERS set how far the body can
# travel per phase (Adam step budget). So root ↑ (rigid push toward the wall) then full ↑ before
# the refine polish. L-BFGS OFF (0 iters, phase dropped) — the per-phase contact patches make an
# active set that churns and invalidates strong-Wolfe curvature.
iters = { root = 100, full = 200, refine = 250, lbfgs = 0 }
overlay = false          # debug overlay → human_optim/kinematic_2_overlay.mp4
labels = "auto"          # contact labels: "auto" (contacts_1 — the pipeline default; manual annotations are metrics-only) | "manual" (data/<stem>.npz)

[stages.dynamics]
device = "cuda"          # GPU: the new BetterRobot batched-adjoint torch RNEA is fast (warp measured slower for this fwd+bwd solve)
bodies = "kinematic_1"   # which refined body the force solve reads (kinematic_1 | kinematic_2)

[stages.kindyn_1]
# Joint kinematics + dynamics. Starts from a converged body + its contact labels and optimizes
# pose AND per-contact-group forces together, so the RNEA base wrench can reshape the motion
# instead of only being absorbed by forces. Forces are
# warm-started (a frozen-q solve, [dynamics_optimizer] knobs), then ONE joint L-BFGS phase
# fine-tunes pose + forces together — Adam was tried and is destructive here (it cannot
# co-adapt N-scale forces to a moving pose; the wrench spikes and the motion wrecks).
iters = { lbfgs = 150 }  # one joint L-BFGS polish (pose + forces); Adam can't co-adapt N-scale forces
bodies = "kinematic_2"   # which refined body to start from (kinematic_2 | kinematic_1 — for chains that skip kinematics_2); picks the matching contacts_<n> too
labels = "auto"          # contact labels: "auto" (the contacts_<n> of `bodies` — the pipeline default; manual annotations are metrics-only) | "manual" (data/<stem>.npz)
cones = false            # [friction] pyramid cones on feet/ankles, frozen at the warm-start pose. OFF:
                         # measured on boulder_1/3 they stack with label errors (jitter 6.7→8.3 mm) and
                         # hurt boulder_1 even with manual labels (pen 1.5→4.2 mm) — a hooking foot
                         # genuinely pulls. Turn on for push-only scenes (e.g. the peter campus board).
overlay = false          # reprojected-keypoint debug overlay → human_optim/kindyn_1_overlay.mp4

#                       root  kin1  kin2   dyn  kindyn1
[loss_weights.kinematic]
reproj_sapiens      = [   8,    8,    8,    0,    8 ]
reproj_init         = [  30,   30,   30,    0,   30 ]
chamfer             = [  10,   10,    0,    0,    0 ]   # OFF in kinematics_2 AND kindyn_1 — both start from the repaired body; chamfer would pull it back toward the (spaghetti-prone) human depth the repair just left
pose_prior          = [ 300,  300,  300,    0,  300 ]
orient_prior        = [  50,   50,   50,    0,   50 ]

[loss_weights.motion]
# The tangent differences of q: velocity (1st) → accel (2nd) → jerk (3rd) → snap (4th).
# A difference row is dropped where its stencil touches an untracked frame — that frame's
# pose is HELD from its neighbour, so the step across the gap is an artefact, not motion.
velocity_root       = [   0,    0,    0,    0,    0 ]   # OFF — a direct penalty on q̇ damps real motion,
velocity_joint      = [   0,    0,    0,    0,    0 ]   # not just jitter. Measured at 24/48: jitter only
                                                        # -2.3% and contact F1 .578 -> .575. Wired; leave at 0.
# kin1 accel by sweep on 6 scenes (x1 / x4 / x16.7 / x41.7): joint-angle jitter 2.752 ->
# 2.688 -> 2.528 -> 2.354 deg/frame, Cartesian joint accel 7.93 -> 6.88 mm/frame², contact
# F1 flat at .578-.579 and reproj_sapiens +0.05 px. Monotone, no saturation, no cost — the
# old 24/48 was simply far below where this term starts to bite. kin2/kindyn_1 unchanged.
# x16.7 is the shipped point: on all 13 annotated scenes it pairs with radial_velocity 400
# for F1 .488 -> .497 and jitter -8.9% with no scene losing more than .008. Going to
# 1000/2000 together with radial 1500 roughly doubles the smoothing (jitter -15.3%,
# Cartesian accel -27.8%) and still beats baseline (F1 .493), but five scenes move down,
# one by .057 — raise both pairs together if you want that trade.
accel_root          = [  24,  400,   24,    0,   24 ]
accel_joint         = [  48,  800,   48,    0,   48 ]
jerk_root           = [ 300,  300,  300,    0,  300 ]   # NOT raised: jerk/snap x4 costs F1 .578 -> .560
jerk_joint          = [ 500,  500,  500,    0,  500 ]   # (they were already the dominant smoothness weights)
snap_root           = [ 300,  300,  300,    0,  300 ]   # 4th-diff snap on top of accel/jerk — highest-freq root jitter
snap_joint          = [ 500,  500,  500,    0,  500 ]
# Damp joint velocity along the viewing ray (worst-constrained axis); kin1 + kin2 + kindyn_1.
# The best smoothing lever measured — it spends its whole budget on the one axis the images
# cannot see. 6-scene ladder x1 / x4 / x15: Cartesian joint accel 7.93 -> 7.09 -> 6.41
# mm/frame², root translation accel 5.70 -> 4.92 -> 4.28, contact F1 .578 -> .584 -> .580,
# reproj_sapiens +0.02 / +0.12 px. 400 shipped (see accel above); kin1 only.
radial_velocity     = [   0,  400,  100,    0,  100 ]

[loss_weights.scene]
# Acts on the 12 CONTACT FRAMES, not on the 1000 subsampled verts (the loss is a mean over
# active points, so ~83× fewer points changed the scale). 12000 by sweep on 4 scenes: residual
# frame penetration 2.3–3.5 → 0.9–1.2 cm (the term's own 1 cm dead-zone edge, i.e. it now
# actually reaches equilibrium) for +0.03…+0.5 px reproj_sapiens vs 4000.
penetration         = [   0, 12000, 12000,    0, 12000 ]   # push the contact frames out of geometry/scene.npz (reported, not a fit gate)

[loss_weights.annotation]
# Label-driven. kinematics_1: AUTO-detected on the 12 CONTACT FRAMES (frozen at the refine phase);
# kinematics_2 + kindyn_1: MANUAL per-joint labels. In kin1 the annotation terms act on the contact
# frame POINTS; in the manual stages on the labelled joints and their vertices.
ann_attraction      = [   0,   10,    0,    0,   20 ]   # pull labelled points onto the wall: kin1-auto pulls the CONTACT FRAMES, kindyn_1 the in-contact joints' verts. OFF in kinematics_2 — its mean-over-active-verts pull BURIED the body (front verts cross the wall, the rest keep pulling); replaced by ann_acquisition + ann_seating.
ann_acquisition     = [   0,    0, 1000,    0,    0 ]   # kinematics_2: per positive (frame, annotation-group) instance, long-range bounded pull of the group's ONE closest vertex toward a target patch of wall points. 1000 chosen by sweep: seats floaters (gtIGgs euclid med 40.8→5.4 cm) at reproj_sap 9.3→28.8 px; 300 under-seats, 3000 buys little for +6 px.
ann_seating         = [   0,    0,    0,    0,    0 ]   # OFF (2026-07-26): its −5 mm target was itself the burial mechanism — on boulder_1/3 removing it cut mean penetration 2.03→0.51 / 0.93→0.26 mm with TP wall distances matching the manual chain; acquisition's fading pull + the penetration term already seat. Wired, raise to re-enable.
ann_repulsion       = [   0,    0, 4000,    0, 4000 ]   # push no-contact verts off — MANUAL only (auto labels carry no negatives; arming them via contacts_1 negatives was tried 2026-07-26 and only added jitter)
ann_velocity        = [   0,  500, 4000,    0, 4000 ]   # damp the labelled points' linear + angular velocity (kin1: contact frames) — the readout reads pre-enforcement drift_pre
ann_acceleration    = [   0,    0,    0,    0,    0 ]   # OFF — near-redundant with a strong ann_velocity (a still joint is already low-accel); wired + ready, raise to damp in-contact joints' Cartesian (LOCAL_WORLD_ALIGNED) acceleration if ann_velocity is lowered to allow slow sliding contacts

# dynamics column = the standalone frozen-q force stage (base_wrench + force_magnitude INSIDE
# the square, smoothness linear). kindyn_1 column = all-LINEAR weights for the same terms in
# the joint engine. Tiny base_wrench because the wrench is O(10³ N) vs kinematic O(1–10²): at
# weight 1 it would swamp the visual fit. The smoothness ratios to base match the dynamics
# stage exactly; force_magnitude (0.01 of base, linear) is ~100× heavier relative to base than
# the dynamics stage's effective 0.01² — it only shapes the force warm-start, and the tuned
# result met its targets, so it stays.
[loss_weights.dynamics]
base_wrench         = [   0,    0,    0,  1.0,  1e-5 ]
force_magnitude     = [   0,    0,    0, 0.01,  1e-7 ]
force_smooth_mag    = [   0,    0,    0, 0.20,  2e-6 ]   # smooth the force MAGNITUDE across persisting contacts (harder than direction)
force_smooth_dir    = [   0,    0,    0, 0.05,  5e-7 ]   # smooth the force DIRECTION (may adapt faster than magnitude)
torque_smooth       = [   0,    0,    0, 0.10,  1e-6 ]

[optimizer]
lr = 0.01
lr_decay = 0.1
lr_lbfgs = 1.0
lbfgs_history = 10

[chamfer]
conf_drop_q = 0.3      # PER-FRAME quantile: drop each frame's lowest-confidence depth fraction (human cloud un-gated at fuse)
max_points = 1500
vertex_subsample = 1000
chunk = 16
emphasis_lo = 0.1      # per-vertex chamfer weight floor (torso); log-mapped. (0.1/10.0/1.0) reproduces the base field
emphasis_hi = 10.0     # per-vertex chamfer weight ceiling (hands/feet)
emphasis_radius = 1.0  # geodesic falloff scale (m); smaller = emphasis hugs the extremities
sampling = "limb_quota"    # human-cloud cap: "limb_quota" (default — group-aware conf gate + guaranteed hand/foot quotas; grouping = nearest projected init joint in px) | "stride" (uniform, the pre-round-12 path)
limb_quota = 200       # sampling="limb_quota": max points each hand/foot group keeps before the rest fills max_points

[keypoints]
score_thresh = 0.3
include_hands = true    # 10 fingertip landmarks (Sapiens ~0.3–0.7 conf on climbers). Measured on 4
                        # scenes: fingertip 2D −23…−42%, wrist up to −13%, hand-frame contacts +4%,
                        # ≤0.25 px cost on head/feet. false = the hands have no image witness at all.
gm_scale_px = 40.0
smooth_window_s = 0.35  # SG-smooth the Sapiens TARGET tracks (s) before opt; loss sees smoothed, gate measured vs RAW. 0 = off

[reproj_init]
gm_scale_px = 30.0
smooth_window_s = 0.35  # same SG smoothing for the init-anchor TARGET tracks; the reproj_init gate is still vs RAW. 0 = off

# Occlusion-aware down-weighting of the visual terms in kinematics_1. A joint the body
# hides jitters because the two things that hold it — the Sapiens 2D keypoint and the
# converter starting pose — are both guesses there. So weight reproj_sapiens, reproj_init
# and pose_prior by a per-joint VISIBILITY, leaving the contact terms free to hold that
# joint still instead. Visibility = the keypoint's Sapiens detection score, smoothed
# ([keypoints].smooth_window_s) and divided by its own 90th percentile over the clip (so it
# measures the score's DROP, not the detector's per-joint calibration); joints with no
# keypoint inherit their parent's. Measured against an exact ray cast on 4 scenes: mean
# score 0.905 clear vs 0.614 occluded.
[occlusion]
strength = 0.0   # weight = 1 - strength*(1 - ratio), clamped to [0,1]. 0 = off.

[penetration]
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding); the quantile gate below does the work
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
margin_m = 0.01
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02
prune_margin_m = 0.30
max_candidates = 6000
normal_k = 16

[ann_attraction]
conf_thresh = 0.1
band_m = 0.30
max_dist_m = 0.30

# kinematics_2 contact-patch repair (ann_acquisition + ann_seating). A contact label means SOME
# surface point of the group touches the wall, so per positive (frame, annotation-group) instance
# ONE closest vertex is pulled — not the whole Voronoi patch. Patches are built once per phase:
# scene points whose projection lands within radius_px of the group's member-vertex pixel
# footprint (confident, in front of camera), the patch_k nearest in 3D.
[ann_acquisition]
radius_px = 60         # target-patch pixel footprint around the group's member verts
patch_k = 64           # target points kept per instance (nearest in 3D to the member centroid)
delta_m = 0.10         # pseudo-Huber knee: bounded ~constant pull beyond it, quadratic fade to 0 within
conf_thresh = 0.1      # scene-point confidence floor for a patch point
# NOTE: confidence-weighting the pull per instance was tried (2026-07-26) and REFUTED: on a
# floating body the witnesses report ~0 confidence for TRUE contacts (gtIGgs medians .07–.34),
# so weighting kills exactly the repair this stage exists for (body stays 30 cm off the wall) —
# while boulder_1's FALSE positives sit at confidence .92 and keep pulling anyway.

# Near-field seat: drive the acquisition vertex's patch-plane signed distance to target_m
# (slight penetration), symmetric so it pushes back out after overshoot; active within ±band_m.
[ann_seating]
target_m = -0.005      # seat 5 mm inside the wall (slight penetration per spec)
band_m = 0.10          # seating engages only within this of the surface (acquisition owns beyond)
huber_m = 0.01         # Huber knee on |s - target_m|

[ann_repulsion]
conf_thresh = 0.1
clearance_m = 0.03
max_dist_m = 0.15
max_pen_m = 0.10
huber_m = 0.02

# Contact velocity damper. The ann_velocity weight damps an in-contact joint's LINEAR
# world velocity; angular_weight adds its ANGULAR velocity (world-orientation change) at
# this fraction of the linear weight. A gripping joint should not twist, but holding
# position matters more (metres vs a dimensionless quaternion distance), so keep it small.
# Applies to both kinematics_1 and kinematics_2.
[ann_velocity]
angular_weight = 0.1

# kin1 auto-contact frozen-label DETECTOR + attraction pull band (looser enter/exit than the readout).
# Detection runs on the 12 CONTACT FRAMES (toes/heels/knees/palms/fingertips), never on joints.
# GUARD: max_dist_m must exceed band_m AND detect_exit_m, and prune_margin_m >= max_dist_m, or detections die silently.
[auto_contact]
detect_thresh_m = 0.08   # enter: a still contact frame within this of the wall becomes a label
detect_exit_m   = 0.12   # stay (hysteresis); >= detect_thresh_m
min_frames = 3
band_m = 0.15            # attraction pull range for a labeled contact frame
max_dist_m = 0.25        # guard; > band_m and > detect_exit_m
prune_margin_m = 0.30    # nearest-neighbour AABB prune; >= max_dist_m
conf_thresh = 0.1
# window_s / still_m are NOT set here: the kin1 detector inherits [contact_gate], so "still"
# means one thing everywhere and one knob moves both.

# Stillness gate: a contact frame is "still" when its NET drift over a ~1/3 s window is small
# (separates a gripping hand's mm-jitter from a slow near-wall pass). still_m = drift at stillness 0.5.
[contact_gate]
window_s = 0.35        # drift window (~11 frames at 30 fps)
still_m  = 0.04        # THE recall knob (raise → more recall), shared by the kin1 detector and the readout

[contacts]
overlay = true         # render the contact overlay
close_thresh_m = 0.03  # enter: "just outside" distance counted as contact
exit_thresh_m = 0.035  # stay: looser hysteresis exit (holds a span, kills 1-frame boundary flicker)
min_frames = 3         # drop contact spans shorter than this many frames
max_dist_m = 0.10
conf_thresh = 0.1      # residual absolute floor (VGGT conf ≥~1 ⇒ non-binding)
conf_drop_q = 0.1      # quantile gate at scene load: drop the lowest-confidence scene voxels
# A contact frame's own normal is NOT a gate — scene points and pose are too noisy to veto on.
# It is used in one place only, with no knob: when both toe frames of a foot are candidates,
# the one looking more into the wall wins and the other is dropped (toe_under vs toe_above).
normal_k = 16
prune_margin_m = 0.10
# span-merge: bridge a short same-frame gap the point barely moved across AND stayed near the wall
# throughout; the re-grip guard (merge_sdf_m) blocks leave-and-return. merge_dist_m = 0 disables.
merge_dist_m = 0.03    # max endpoint displacement across the gap (m)
merge_max_gap_s = 2.0  # only bridge gaps shorter than this (s)
merge_sdf_m = 0.08     # re-grip guard: it stayed within this signed distance of the wall the whole gap

# The FORCE WITNESS in the contact readout. The detector above needs a contact frame to be
# near the scene; when the reconstruction puts the body in the wrong place that never
# happens and the contact is lost. So the stage also asks physics: with the pose frozen,
# inverse dynamics says what force the body still needs to move the way it does, and the
# solve finds the world forces at the 12 contact frames that explain it — each one confined
# to a 45 degree friction cone about that patch of skin, so a frame can only explain what it
# is oriented to explain. A frame that has to carry theta_bw of the body's weight is called
# in contact, and that label is UNIONED onto the geometric one (add-only, never removes).
# Everything else about the solve is a fixed, measured choice in the code, not a knob.
[contact_force]
theta_bw = 0.05            # fraction of body weight at which a frame counts as loaded
lambda_tau = 0.0           # per-joint effort rows: wired, measured neutral (F1 .719 off / .717 on)
gap_dstar_m = 0.05         # gap price: force this far from the scene is already expensive
stillness_vstar_mps = 0.2  # stillness price: force on a frame drifting this fast is expensive

# Force application points for the dynamics stage: two hands (wrist + fingers folded
# onto the wrist), two feet, two ankles — six joints. A joint carries a force only on
# frames it is labelled in contact. Body mass + inertia come baked from BetterHuman.
[contact]
groups = ["left_hand", "right_hand", "left_foot", "right_foot", "left_ankle", "right_ankle"]

# Friction cone for the non-hand contact groups (feet + ankles). A foot/ankle contact can
# only PUSH along the surface normal and its sideways (tangential) force is capped at μ·(normal
# force), μ = tan(half_angle_deg). Enforced BY CONSTRUCTION, not by a loss: the force is built
# as a nonnegative combination of the cone's four pyramid edge directions, so it cannot leave
# the cone and there is no weight to tune. The normal is read from the fused scene cloud:
# average the stored normals of the normal_k nearest scene points to the joint (they point out
# of the wall toward the climber). A joint whose nearest scene point is beyond max_dist_m — or
# whose neighboring normals disagree (they average to ~nothing on thin holds / concave
# corners) — gets a free bilateral force instead, like a hand. Ankle centers sit a few cm
# inside the leg, so keep max_dist_m generous. Comment out this section to run the dynamics
# stage (and the completion force solve) without cones; kindyn_1 opts in via [stages.kindyn_1].cones.
[friction]
half_angle_deg = 45.0   # μ = tan(45°) = 1
normal_k = 16
max_dist_m = 0.30

[dynamics_optimizer]
max_iter = 200
history_size = 20
lr = 1.0
tolerance_grad = 1e-9
tolerance_change = 1e-12

[runtime]
device = "cuda"
