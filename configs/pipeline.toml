# Orchestrator config for scripts/pipeline.py (file-based, small-batch).
# Per-stage knobs + step selection. Each stage is also runnable standalone
# (see scripts/stages/); standalone CLIs read their knobs from this file.

[steps]
# Active stages, in order; the chain ends at human_optimization (four-stage SMPL-X
# refinement). List order is honoured: `fuse` builds the point clouds in VGGT's
# up-to-scale world; `scale` (estimate_scale) then measures the metric factor against
# the fused human points and rescales the saved geometry in place. `--steps` runs any subset.
run = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale", "human_optimization"]

[runtime]
device = "cuda"             # compute device of the stages (the viewer poses bodies on the CPU)

[sam3]                      # SAM 3 video tracker → sam3/ (per-object masks + bboxes.npz)
text = "person"             # grounding prompt for frame-0 detection
top_k = 0                  # max detections per text prompt; 0 keeps all
confidence = 0.5           # grounding confidence threshold
min_area_frac = 0.01       # minimum grounded-mask fraction of the image
bbox = []                  # optional frame-0 xyxy prompt; empty uses text/manifest prompts
mask = ""                  # optional frame-0 mask path; empty disables
points = []                # optional point prompts as ["X,Y,+", "X,Y,-"]
prompts = ""               # optional multi-prompt JSON path; empty disables
label = ""                 # optional single-object display label; empty uses text
part_length = 200          # frames per propagation part
overlay = true             # render mask and bbox overlays
fps = ""                   # overlay fps; empty uses source fps or 30
checkpoint = ""            # SAM 3 checkpoint path; empty uses HuggingFace download
masks_subdir = "sam3"      # output subdir under each item
skip_existing = false      # skip items whose bboxes.npz already exists
dtype = "fp16"             # model dtype hint retained from the precompute runner

[vggt]                      # VGGT-Omega multi-view camera + depth → vggt/camera.npz
max_frames = 500            # cap per CAMERA VIEW; longer clips are uniformly subsampled (all views = one forward)
frame_chunk = 0             # frames per chunk of the frame-local blocks; 0 runs them all at once
token_chunk = 0             # query tokens per chunk of the cross-frame attention; 0 runs it all at once
image_resolution = 512      # VGGT input resolution (512 model; use 256 for the text-aligned model)
mode = "balanced"           # load_and_preprocess_images sizing: balanced | max_size
save_depth = true           # also dump per-frame depth + confidence at the VGGT resolution (heavy; scale + fuse need it)
checkpoint = "facebook/VGGT-Omega" # local .pt path or HF repo id
subdir = "vggt"             # output subdir under each item
skip_existing = false      # skip items whose camera.npz already exists
dtype = "fp16"             # model dtype hint
# Note: VGGT depth/translation are UP-TO-SCALE (not metric) — one arbitrary per-clip scale shared with the cameras.

[sapiens]                   # Sapiens2 pose (keypoints) → sapiens/
tasks = "pose"              # subset of {pose, pointmap, normal}; pointmap/normal are heavy & opt-in
overlay = true              # render pose skeleton overlay
label = "person"            # bboxes.npz label selected for pose
subdir = "sapiens"          # output subdir under each item
batch_size = 1             # bbox-crop batch size for pose inference
checkpoint_root = ""        # checkpoint tree override; empty uses the HF cache
score_thresh = 0.3         # overlay keypoint score threshold
fps = ""                   # overlay fps; empty uses 30
skip_existing = false      # skip items whose task output already exists
dtype = "fp16"             # model dtype hint

[scale]                     # human-anchored metric scale (runs AFTER fuse; rescales geometry/ in place)
conf_drop_q = 0.3           # drop this lowest-confidence fraction of cloud points per frame (ruler + pre-fit)
min_inlier_verts = 50       # skip a frame with fewer inlier vertices than this
mad_k = 3.0                 # reject frames beyond this many MADs from the median log-scale
skip_existing = false       # skip when scale.npz exists and the world is already metric
# pre-fit: dual scale + body refinement → geometry/prefit.npz (see docs/scale.md)
prefit = true               # false → ruler-only scale, no body alignment
rounds = 4                  # body-round ↔ scale-re-measure alternations (early-stops at 0.1%)
iters = 150                # Adam iterations per body round (per person)
lr = 0.01                # Adam learning rate
w_chamfer = 1.0             # depth term: every cloud point near a visible body vertex
w_reproj = 0.5              # Sapiens reprojection weight (holds the body on the image)
w_pose = 2.0                # pull of the joint rotations toward the converter pose
w_orient = 1.0              # gentle root-orientation pull (stops ~180° flips)
w_transl = 0.5              # gentle root-translation pull (m²; anchors depth where the image is silent)
w_smooth = 0.1              # tiny converter-velocity tie on the posed joints
gm_chamfer_m = 0.3          # chamfer robust scale (m); larger is more L2-like
gm_reproj_px = 10.0         # reprojection robust scale (px)
max_points = 2000           # depth points per frame for chamfer
vertex_subsample = 3000     # body vertices used for chamfer

[fuse]                      # backproject VGGT → up-to-scale point clouds → geometry/ (runs BEFORE scale)
voxel_px = 5.5              # scene merge voxel size, in pixel footprints at the median scene depth
conf_drop_q = 0.3           # drop this lowest-confidence fraction of VGGT depth (scene only; human keeps all)
edge_rtol = 0.04            # depth-edge (flying-pixel) filter tolerance; 0 disables
human_dilate = 8            # grow the human mask N px before subtracting from the scene (cleaner scene); 0 disables
min_scene_voxels = 25       # drop scene clusters smaller than this many connected voxels (floating blobs); 1 disables
person_obj_ids = ""         # restrict SAM3 ids treated as people, e.g. "0,1"; empty → all
static_motion_max = 0.02    # shot counts as locked while the scene slides less than this fraction of the image width
skip_existing = false      # skip when geometry/transform.npz exists

[sam3d]                     # SAM-3D-Body MHR fit → sam3d/params.npz (camera from VGGT via fuse)
obj_ids = ""                # tracked people to fit; empty → ALL tracked, else "0,1". Stacked (P,N,...)
inference_type = "full"     # "full" (body+hands) or "body"
overlay = true              # render the combined mesh overlay (all people) → sam3d/overlay.mp4
subdir = "sam3d"            # manifest batch output subdir
skip_existing = false      # batch mode: skip existing params.npz
hf_repo = "facebook/sam-3d-body-dinov3" # SAM-3D-Body HuggingFace repo
fps = ""                   # overlay fps; empty uses source fps or 30

[smplx]                     # MHR → SMPL-X (pip smplx) → sam3d/smplx_params.npz
iters = 300                 # fine-stage Adam iterations
gender = "neutral"          # neutral | male | female
overlay = true              # render the combined SMPL-X overlay (all people) → sam3d/smplx_overlay.mp4
subdir = "sam3d"            # manifest batch input/output subdir
skip_existing = false      # batch mode: skip existing smplx_params.npz
smplx_model_folder = ""     # model parent override; empty uses better_human/models
batch_size = 64            # converter frame batch size
fps = ""                   # overlay fps; empty uses source fps or 30

[gravity]                   # GeoCalib world-frame gravity → geocalib/gravity.npz
num_frames = 48            # frames sampled uniformly across the clip
conf_rel = 0.5             # relative confidence gate
inlier_deg = 8.0           # world-frame angular inlier threshold
min_frames = 5             # minimum frames retained by the confidence gate
conf_floor = 0.01          # minimum reliable absolute GeoCalib confidence
min_diversity_deg = 8.0    # minimum selected camera-rotation spread
max_spread_deg = 5.0       # maximum reliable gravity inlier spread
fallback_gravity = "0,1,0" # world-down direction used when inference is unreliable
ground = true              # fit a floor plane to the fused scene; its normal wins when accepted
ground_min_points = 500    # reject the floor fit below this many inlier points
ground_max_tilt_deg = 30.0 # reject when the floor normal strays this far from the prior down
weights = "pinhole"        # GeoCalib checkpoint: pinhole | distorted
skip_existing = false      # skip when geocalib/gravity.npz exists

[bedlam]                    # scripts/label_bedlam2.py ground-contact readout → gt/contacts.npz
                           # (masks / boxes / validity have no knobs beyond the 1/3-out-of-frame
                           #  rule baked into tools/bedlam_masks.py)
window_s = 0.20            # seconds the contact-frame speed is averaged over (a tenth either side)
still_mps = 0.10           # speed (m/s) at which a point is half in contact; twice this kills a label.
                           #  The speed is BetterRobot's: frame Jacobian x generalised velocity
enter_m = 0.08             # height above the floor that starts a contact, metres. Wide on purpose:
                           #  BEDLAM2 lifts the whole body by the shoe sole and poses the naked toes
                           #  5-7 cm up inside a flat shoe (see tools/bedlam_contacts.ENTER_M)
exit_m = 0.10              # looser height that holds one (hysteresis, so labels do not blink)
max_tilt_deg = 55          # the skin at a contact frame must face the floor within this. What keeps
                           #  the ball of a vertical foot (60-75 deg) out of the wide band above while
                           #  a kneeling patella (45 deg) and the sacrum (46 deg) stay in
min_span_s = 0.10          # shortest contact that is not flicker, seconds
suspect_m = 0.15           # top of the band the readout is blind to (too high to label, too low to
                           #  be airborne); its share is reported per scene as "plane suspect"
touch_m = 0.01             # lowest MESH vertex within this of the floor = the body is touching it
                           #  (reporting only; measured on the mesh so the support check is not circular)

[bedlam_forces]             # scripts/label_bedlam2.py --step forces → gt/forces.npz: the kindyn_1
                           # force solve at the frozen ground-truth pose (tools/bedlam_forces.py)
config = "configs/human_optimization.toml"   # the kindyn_1 dynamics column, [torque.multipliers],
                                             #  [friction] and [dynamics_optimizer] come from here
edge_speed_m_s = 0.8       # force_edge × 1/(1+(v/0.8)²), v = the body's vertical speed across the
                           #  contact switch: a landing may step to full load, a heel strike may not
device = "cpu"             # the solve is a few hundred tiny L-BFGS steps — launch-bound on a GPU,
                           #  where workers just queue; on the cores it scales with --workers

[bedlam_forces.weights]    # laid over the kindyn_1 column above
force_edge = 3000          # the force on the first/last frame of every contact interval — loads
                           #  ramp in and out instead of stepping (the OpenCap validation term)

[viewer]                    # scripts/view_3d.py display and scene-selection knobs
port = 8082                # viser server port
point_size = 0.02          # scene point radius in metres
human_point_size = 0.01    # human point radius in metres
camera_scale = 0.1         # initial camera-frustum size in metres
up = "-y"                  # viewer up direction
smplx = true               # load fitted SMPL-X bodies
human_max_points = 6000    # max human points per frame and climber; 0 keeps all
video = false              # sidebar video pane; off skips the decode and the per-frame streaming (laggy over remote)
                           # (--bedlam turns it on regardless: the footage is what you check the bodies against)
video_dir = ""             # source-video directory; empty uses the viewer default
data_root = ""             # ClimbingVideos root; empty uses the scene DB default
categories = "1,2"         # ClimbingVideos vlm_category CSV filter
rope_supported = 0        # rope-supported filter; -1 selects any
scene_ids = ""             # optional scene-id CSV; empty selects all matches
sample = ""                # optional random subset size; empty disables sampling
limit = ""                 # optional first-N limit; empty disables limiting
seed = 0                   # random-sampling seed

[human_optimization]        # four-stage SMPL-X refinement → human_optim/ (default chain: root, kinematics_1)
config = "configs/human_optimization.toml"   # stage selection + all knobs live in THAT file
