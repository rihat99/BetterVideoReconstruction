# Orchestrator config for scripts/pipeline.py (file-based, small-batch).
# Per-stage knobs + step selection. Each stage is also runnable standalone
# (see scripts/stages/); those CLIs carry the full set of flags.

[steps]
# Active stages, in order; the chain ends at human_optimization (four-stage SMPL-X
# refinement). List order is honoured: `scale` (estimate_scale) anchors VGGT's metric
# scale to the SAM-3D-Body human ruler, so it runs after the body / SMPL-X stages and
# before `fuse` (which applies it). `--steps` runs any subset.
run = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "scale", "fuse", "human_optimization"]

[runtime]
device = "cuda"             # GPU device for the model stages (sam3/vggt/sapiens/sam3d/smplx)

[sam3]                      # SAM 3 video tracker → sam3/ (per-object masks + bboxes.npz)
text = "person"             # grounding prompt for frame-0 detection

[vggt]                      # VGGT-Omega multi-view camera + depth → vggt/camera.npz
max_frames = 500            # cap per clip; longer clips are uniformly subsampled (multi-view = one forward)
image_resolution = 512      # VGGT input resolution (512 model; use 256 for the text-aligned model)
mode = "balanced"           # load_and_preprocess_images sizing: balanced | max_size
save_depth = true           # also dump per-frame depth + confidence at the VGGT resolution (heavy)
checkpoint = ""             # local .pt path or HF repo id; empty → download facebook/VGGT-Omega (access-gated)
# Note: VGGT depth/translation are UP-TO-SCALE (not metric) — one arbitrary per-clip scale shared with the cameras.

[sapiens]                   # Sapiens2 pose (keypoints) → sapiens/
tasks = "pose"              # subset of {pose, pointmap, normal}; pointmap/normal are heavy & opt-in
overlay = true              # render pose skeleton overlay

[scale]                     # human-body-anchored metric scale → geometry/scale.npz (runs before fuse)
conf_drop_q = 0.3           # drop this lowest-confidence fraction of in-mask body vertices per frame
min_inlier_verts = 50       # skip a frame with fewer inlier vertices than this
mad_k = 3.0                 # reject frames beyond this many MADs from the median log-scale

[fuse]                      # backproject VGGT → metric point clouds (scale from geometry/scale.npz) → geometry/
voxel_scene = 0.05          # scene merge voxel size, metres
conf_drop_q = 0.3           # drop this lowest-confidence fraction of VGGT depth (scene only; human keeps all)
edge_rtol = 0.04            # depth-edge (flying-pixel) filter tolerance; 0 disables
human_dilate = 8            # grow the human mask N px before subtracting from the scene (cleaner scene); 0 disables
min_scene_voxels = 25       # drop scene clusters smaller than this many connected voxels (floating blobs); 1 disables
person_obj_ids = ""         # restrict SAM3 ids treated as people, e.g. "0,1"; empty → all

[sam3d]                     # SAM-3D-Body MHR fit → sam3d/params.npz (camera from VGGT via fuse)
obj_ids = ""                # tracked people to fit; empty → ALL tracked, else "0,1". Stacked (P,N,...)
inference_type = "full"     # "full" (body+hands) or "body"
overlay = true              # render the combined mesh overlay (all people) → sam3d/overlay.mp4

[smplx]                     # MHR → SMPL-X (pip smplx) → sam3d/smplx_params.npz
iters = 300                 # fine-stage Adam iterations
gender = "neutral"          # neutral | male | female
overlay = true              # render the combined SMPL-X overlay (all people) → sam3d/smplx_overlay.mp4

[human_optimization]        # four-stage SMPL-X refinement → human_optim/ (default chain: root, kinematics_1)
config = "configs/human_optimization.toml"
stages = ""                 # subset of root,kinematics_1,kinematics_2,dynamics; empty → config [stages].run
overlay = false             # reprojected-keypoint debug overlay → human_optim/kinematic_1_overlay.mp4
