# Force-related terms measured at the 30 fps reference on any clip, the kinematic stages stock:
# the contacts stage's force solve differentiates over round(fps/30) frames, and kindyn_1's
# force / torque smoothness differences over the same stencil. Identical to the general config
# below 45 fps. (The kinematic fps scaling of human_optimization_highfps.toml is left out: on
# the 100-120 fps wild clips it did not smooth the root and broke one person after a tracking gap.)
base = "configs/human_optimization.toml"

[contact_force]
step_30fps = true

[stages.kindyn_1]
smooth_step_30fps = true
