# The datasets scripts/run_dataset.py runs the chain over, and the variant chains.
#
# Paths are relative to the data root (tools/paths.py: ../data, or $BVR_DATA_ROOT);
# configs are file names under configs/. A dataset has one video per clip
# (`clips`: the glob that finds them, <root>/<clip>/video.mp4) or is a camera rig
# (`views`: the cameras, <root>/<clip>/<view>.mp4). On a rig the first view is the one
# the single-view tree `out` was built from; any other `--views` selection goes to
# `out_multi`, where only `multi_steps` run (every later stage assumes one view).
# `steps` is the chain, in order: the first five are manifest sweeps (the model loads
# once and sweeps every clip), the rest run per clip.

[datasets.parkour]            # LAAS Parkour (scripts/import_parkour.py), one static lab camera
root = "Parkour-dataset/processed"
clips = "*/video.mp4"
out = "Parkour-dataset/processed/out"
pipeline_config = "pipeline_peter.toml"
human_config = "human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale", "gravity",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

[datasets.opencap]            # OpenCap LabValidation (scripts/import_opencap.py), one static iPhone
root = "LabValidation_withVideos/processed"
clips = "*/video.mp4"
out = "LabValidation_withVideos/processed/out"
pipeline_config = "pipeline_opencap.toml"
human_config = "human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale", "gravity",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

# The peter rigs: synchronized static cameras and force boards; no gravity step (the rig
# runs never used GeoCalib).
[datasets.campus_board]
root = "peter/campus_board"
views = ["cam_left", "cam_right"]
out = "peter/out_campus_board_single"
out_multi = "peter/out_campus_board_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "pipeline_peter.toml"
human_config = "human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

[datasets.climb_wall_2]
root = "peter/climb_wall_2"
views = ["cam_left", "cam_right", "cam_3"]
out = "peter/out_climb_wall_2_single"
out_multi = "peter/out_climb_wall_2_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "pipeline_peter.toml"
human_config = "human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

[datasets.climb_wall_3]
root = "peter/climb_wall_3"
views = ["cam_left", "cam_right", "cam_3"]
out = "peter/out_climb_wall_3_single"
out_multi = "peter/out_climb_wall_3_multi"
multi_steps = ["sam3", "vggt", "fuse"]
pipeline_config = "pipeline_peter.toml"
human_config = "human_optimization_peter.toml"
steps = ["sam3", "vggt", "sapiens", "sam3d", "smplx", "fuse", "scale",
         "kinematics_1", "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]

# `--variant <name>` re-runs the human chain into <clip>/human_optim_<name>/ through a
# symlink farm <clip>/_<name>/ (inputs link to the real tree, human_optim IS the variant
# directory), leaving human_optim/ intact. A name without a table here runs the plain
# chain (kinematics_1 .. kindyn_1) with configs/human_optimization_<name>.toml.
#   steps     its own chain (default: the plain chain); a support_scene_* step makes the
#             farm own geometry/, with the variant's synthetic scene.npz in it
#   config    human TOML (default: human_optimization_<name>.toml)
#   inherit   files of the normal run's human_optim/ linked in instead of recomputed
#   contacts  "boards": measured board contacts (measure_contacts_boards.py), not estimated
#   requires  a file under <out>/<clip>/ a clip must have to be run at all

[variants.floorplane]         # a synthetic support scene replaces the fused cloud
steps = ["support_scene_floor", "kinematics_1", "support_scene_plateaus",
         "contacts_1", "kinematics_2", "contacts_2", "kindyn_1"]
config = "human_optimization_floorplane.toml"

# The plain chain with the edgev kindyn knobs on the clip's REAL fused cloud. The edgev
# runs on disk were kindyn-only reruns inside the floorplane farm (geometry and the
# kinematics/contacts linked from human_optim_floorplane); no committed code builds that
# layout, so this variant does not reproduce them.
[variants.floorplane_edgev]
config = "human_optimization_floorplane_edgev.toml"

[variants.gt_contact]         # the contact-consuming chain on MEASURED board contacts
steps = ["contacts_1", "kinematics_2", "contacts_2", "kindyn_1", "overlay"]
config = "human_optimization_peter.toml"
inherit = ["kinematic_1.npz", "sensor_forces.npz"]
contacts = "boards"
requires = "human_optim/sensor_forces.npz"
